name: Descargar voz del sargento
on:
  push:
    paths: ["voz/urls.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  voz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar audios de ElevenLabs
        run: |
          python3 - <<'PY'
          import json,urllib.request,os
          u=json.load(open("voz/urls.json"));ok=[]
          for k,url in sorted(u.items()):
              try:
                  urllib.request.urlretrieve(url,f"voz/{k}.mp3")
                  if os.path.getsize(f"voz/{k}.mp3")>1000: ok.append(k)
              except Exception as e: print("fallo",k,e)
          prev=json.load(open("voz/lista.json")) if os.path.exists("voz/lista.json") else []
          json.dump(sorted(set(prev+ok)),open("voz/lista.json","w"))
          print(len(ok),"audios")
          PY
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voz/*.mp3 voz/lista.json
          git commit -m "Voz del sargento: audios descargados" || echo "sin cambios"
          git push
