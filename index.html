const POSE={
"Postura del niño":["De rodillas, siéntate sobre los talones y lleva el pecho a los muslos con los brazos estirados delante. Suelta la espalda y respira hacia las costillas.","Lumbar, dorsal y cadera (estiramiento)"],
"Gato-vaca":["A cuatro patas, manos bajo los hombros. Al soltar el aire redondea la espalda mirando al ombligo; al cogerlo arquéala mirando al frente. Lento y con la respiración.","Columna y abdomen (movilidad)"],
"Perro boca abajo":["Desde cuatro patas, sube la cadera formando una V invertida. Empuja el suelo con las manos, lleva el pecho hacia las piernas y los talones hacia el suelo (pueden no llegar).","Hombros, isquios y gemelos"],
"Saludo al sol: plancha, cobra y perro":["Encadena: plancha con el cuerpo recto, baja al suelo, sube el pecho en cobra y empuja la cadera atrás a perro boca abajo. Una respiración por postura.","Cuerpo completo: hombros, abdomen, isquios"],
"Guerrero I":["Paso largo, pie de atrás girado 45°. Dobla la rodilla delantera sobre el tobillo, cadera mirando al frente y brazos arriba junto a las orejas.","Cuádriceps, glúteo y flexor de la cadera de atrás"],
"Guerrero II":["Piernas muy abiertas, pie delantero al frente y el de atrás de lado. Dobla la rodilla delantera hasta 90° y abre los brazos en cruz mirando por encima de la mano delantera.","Cuádriceps, glúteo, aductores y hombros"],
"Triángulo":["Piernas abiertas y estiradas, pie delantero al frente. Inclina el tronco sobre la pierna delantera bajando la mano a la espinilla y sube el otro brazo al techo.","Isquios, aductores y oblicuos"],
"Lagartija":["Zancada baja con la rodilla de atrás en el suelo. Pon las dos manos por dentro del pie delantero y deja caer la cadera hacia el suelo.","Flexores de la cadera, aductores y glúteo"],
"Paloma":["Desde perro boca abajo, lleva una rodilla detrás de la muñeca del mismo lado con la espinilla cruzada y estira la otra pierna atrás. Baja el tronco si puedes.","Glúteo y rotadores de la cadera"],
"Cobra":["Boca abajo, manos bajo los hombros. Empuja suave y sube el pecho manteniendo la cadera en el suelo y los hombros lejos de las orejas.","Lumbar (extensión) y abdomen (estiramiento)"],
"Esfinge":["Boca abajo, apoyado en los antebrazos con los codos bajo los hombros. Sube el pecho y relaja la zona lumbar.","Lumbar y abdomen (estiramiento suave)"],
"Torsión tumbado":["Boca arriba, brazos en cruz. Lleva las rodillas dobladas a un lado y gira la cabeza al otro, con los hombros pegados al suelo.","Columna, glúteo y pecho"],
"Hilo en la aguja":["A cuatro patas, pasa un brazo por debajo del otro hasta apoyar el hombro y la sien en el suelo. Respira y cambia de lado.","Espalda alta y hombro posterior"],
"Savasana":["Boca arriba, brazos y piernas sueltos y separados del cuerpo, ojos cerrados. No hagas nada: deja que el cuerpo pese.","Relajación de todo el cuerpo"],
"Guerrero III":["De pie sobre una pierna, inclina el tronco adelante y estira la otra pierna atrás hasta formar una T con el cuerpo. Brazos al frente o en la cadera.","Glúteo, isquios, lumbar y equilibrio"],
"Puente":["Boca arriba, rodillas dobladas y pies cerca de la cadera. Sube la cadera apretando glúteo hasta alinear rodillas, cadera y hombros, y aguanta.","Glúteo, isquios y lumbar"],
"Plancha lateral":["Apoyado en un antebrazo con el codo bajo el hombro y los pies uno sobre otro. Sube la cadera hasta que el cuerpo quede recto y aguanta.","Oblicuos, abdomen y glúteo medio"],
"Pinza sentado":["Sentado con las piernas estiradas, inclínate desde la cadera llevando el pecho hacia los muslos sin redondear mucho la espalda.","Isquios y lumbar (estiramiento)"],
"Rana":["A cuatro patas, abre las rodillas todo lo que puedas con los pies hacia fuera y lleva la cadera atrás despacio.","Aductores y cadera"],
"Mariposa":["Sentado, junta las plantas de los pies y deja caer las rodillas hacia el suelo. Inclínate un poco adelante con la espalda recta.","Aductores y cadera"],
"Relajación guiada":["Tumbado y quieto, recorre el cuerpo con la atención de los pies a la cabeza soltando cada zona al exhalar.","Relajación de todo el cuerpo"],
"Respiración 4-6 tumbado":["Boca arriba con las rodillas dobladas. Coge aire por la nariz 4 s hinchando la barriga y suéltalo 6 s por la boca. Bajar pulsaciones.","Diafragma (respiración)"],
"Siéntate cómodo y respira: 4 s dentro, 6 fuera":["Sentado con la espalda recta. Coge aire 4 s por la nariz y suéltalo 6 s, sin forzar.","Diafragma (respiración)"],
"Hombros y cuello en círculos lentos":["De pie o sentado, haz círculos amplios y lentos con los hombros y luego gira la cabeza despacio hacia cada lado.","Trapecio, cuello y hombros (movilidad)"],
"The Hundred":["Boca arriba, piernas arriba (rodillas a 90° si cuesta) y hombros despegados. Bate los brazos estirados arriba y abajo: 5 pulsos cogiendo aire y 5 soltándolo, hasta 100.","Recto abdominal y transverso"],
"Roll-up":["Boca arriba con los brazos sobre la cabeza. Sube vértebra a vértebra hasta tocar los pies y baja igual de despacio, sin impulso.","Recto abdominal"],
"Círculos de pierna":["Boca arriba, una pierna estirada al techo. Dibuja círculos con ella sin que se mueva la cadera; cambia de sentido y de pierna.","Abdomen, flexores de cadera y aductores"],
"Rodar como una pelota":["Sentado hecho una bola, manos en las espinillas y pies en el aire. Rueda hacia atrás hasta los omóplatos y vuelve a equilibrarte sin tocar el suelo con los pies.","Abdomen y masaje de la columna"],
"Estiramiento de una pierna":["Boca arriba con los hombros despegados. Lleva una rodilla al pecho y estira la otra pierna en diagonal; cambia rítmicamente.","Recto abdominal y transverso"],
"Estiramiento de dos piernas":["Boca arriba hecho una bola. Estira a la vez brazos atrás y piernas en diagonal, haz un círculo con los brazos y vuelve a la bola.","Recto abdominal y transverso"],
"Tijeras":["Boca arriba con los hombros despegados y las piernas estiradas al techo. Baja una pierna y acerca la otra con las manos; cambia como unas tijeras.","Abdomen e isquios"],
"Criss-cross":["Boca arriba, manos en la nuca. Lleva el codo hacia la rodilla contraria mientras estiras la otra pierna; alterna despacio.","Oblicuos y recto abdominal"],
"Estiramiento de columna":["Sentado con las piernas estiradas y abiertas, brazos al frente. Enróllate hacia delante como si pasaras por encima de una pelota y vuelve a sentarte alto.","Columna e isquios"],
"Sierra":["Sentado con piernas abiertas y brazos en cruz. Gira el tronco y lleva la mano al pie contrario como si serraras el dedo pequeño; vuelve y cambia.","Oblicuos, columna e isquios"],
"Cisne":["Boca abajo, manos bajo los hombros. Sube el pecho alargando la columna con la espalda, no empujando con los brazos, y baja.","Lumbar y espalda alta"],
"Natación":["Boca abajo con brazos y piernas estirados y despegados. Bate brazo y pierna contrarios en pequeños pulsos, como nadando.","Lumbar, glúteo y espalda"],
"Patada lateral":["Tumbado de lado en línea recta. Lleva la pierna de arriba adelante con dos pulsos y luego atrás, sin mover el tronco.","Glúteo medio y abdomen"],
"Teaser":["Boca arriba, sube a la vez tronco y piernas hasta formar una V equilibrado sobre la pelvis, brazos hacia los pies. Baja despacio.","Recto abdominal y flexores de cadera"],
"Teaser con 3 s de bajada":["Igual que el teaser, pero bajando en 3 s contados sin perder la forma.","Recto abdominal y flexores de cadera"],
"Segunda ronda: The Hundred":["Repite The Hundred: piernas más bajas si puedes sin que la lumbar se despegue.","Recto abdominal y transverso"],
"Segunda ronda: criss-cross":["Repite el criss-cross, más lento y girando más.","Oblicuos y recto abdominal"],
"Segunda ronda: teaser":["Repite el teaser con más control en la bajada.","Recto abdominal y flexores de cadera"],
"Patada a una pierna":["Boca abajo apoyado en los antebrazos. Dobla una rodilla llevando el talón al glúteo con dos pulsos y alterna.","Isquios y glúteo"],
"Tracción de pierna en plancha":["En plancha con brazos estirados. Sube una pierna estirada sin mover la cadera y bájala; alterna.","Glúteo, abdomen y hombros"],
"Sacacorchos":["Boca arriba con las piernas juntas al techo. Dibuja con ellas un círculo a un lado, abajo y al otro, sin que se despegue la espalda alta.","Oblicuos y abdomen"],
"Foca":["Sentado hecho una bola sujetando los tobillos por dentro. Rueda atrás, da 3 palmadas con los pies y vuelve a equilibrarte.","Abdomen y masaje de la columna"],
"Dos piernas":["Boca abajo, manos entrelazadas en la espalda. Lleva los talones al glúteo con tres pulsos y luego estira piernas y sube el pecho.","Lumbar, glúteo e isquios"],
"Respiración con piernas en la pared":["Tumbado con la cadera cerca de la pared y las piernas apoyadas en ella. Respira lento por la nariz.","Relajación e isquios"],
"Círculos de cadera, hombro y columna":["De pie, haz círculos amplios con la cadera, luego con los hombros y al final ondula la columna.","Movilidad general"],
"Cambios de cadera 90/90":["Sentado con las dos rodillas a 90°, una delante y otra al lado. Gira las rodillas al otro lado sin usar las manos.","Rotadores de la cadera y glúteo"],
"Cadera 90/90":["Sentado con las dos rodillas a 90°. Inclina el tronco sobre la pierna delantera con la espalda recta y aguanta.","Rotadores de la cadera y glúteo"],
"Estiramiento de cuádriceps contra la pared":["De rodillas de espaldas a la pared, apoya el empeine de atrás en ella con la rodilla en el suelo y la otra pierna delante. Sube el tronco.","Cuádriceps y flexor de la cadera"],
"Libro abierto torácico":["Tumbado de lado con las rodillas dobladas y los brazos al frente. Abre el brazo de arriba hacia el otro lado siguiéndolo con la mirada y vuelve.","Espalda alta y pecho (movilidad)"],
"Sentadilla profunda agarrado a la puerta":["Agarrado al pomo o marco, baja a sentadilla lo más profundo posible con los talones en el suelo y el pecho alto. Aguanta respirando.","Cadera, tobillo y aductores"],
"Deslizamientos en pared":["De espaldas a la pared, brazos en W con codos y manos tocándola. Desliza los brazos hacia arriba sin despegarlos y baja.","Trapecio inferior y hombro"],
"Dislocaciones de hombro con banda":["Banda sujeta con agarre muy ancho y brazos estirados. Pásala por encima de la cabeza hasta la espalda y vuelve, sin doblar los codos.","Hombros y pecho (movilidad)"],
"Gemelo contra la pared":["Manos en la pared, una pierna atrás estirada con el talón en el suelo. Lleva la cadera adelante hasta notar el gemelo.","Gemelo y sóleo"],
"Trote suave en la cinta":["Trota muy suave, a ritmo de poder hablar, para calentar.","Cardio, piernas"],
"Trote suave":["Trota muy suave, a ritmo de poder hablar.","Cardio, piernas"],
"Skipping A":["Corre en el sitio o avanzando corto subiendo la rodilla a la altura de la cadera y apoyando la punta del pie bajo el cuerpo.","Flexores de cadera, gemelo"],
"Skipping B":["Como el skipping A, pero al subir la rodilla estira la pierna adelante y baja arañando el suelo hacia atrás.","Isquios, flexores de cadera"],
"Skipping con saltos":["Skipping con un pequeño salto en cada paso, brazos activos.","Gemelo, flexores de cadera"],
"Balanceos de pierna":["Apoyado en la pared, balancea una pierna adelante y atrás, luego de lado a lado, cada vez más amplio.","Cadera e isquios (movilidad)"],
"Saltos de tobillo":["Saltitos rápidos con las piernas casi estiradas, rebotando solo con los tobillos.","Gemelo y tendón de Aquiles"],
"World's greatest stretch":["Zancada larga, mano del mismo lado en el suelo. Lleva el codo hacia el tobillo, luego gira el brazo al techo y por último estira la pierna delantera.","Cadera, espalda alta e isquios"],
"Escalera dibujada: dos pies dentro, dentro-fuera, cruces":["Dibuja o imagina una escalera en el suelo y recórrela rápido: dos pies en cada hueco, luego dentro-fuera y cruzando.","Coordinación, gemelo y velocidad de pies"],

function heatCard(){const t=todayISO(),ws=weekStartOf(t),start=addDays(ws,-7*13),cs=15,gp=3,L=26;let cells="",mlab="",lastM=-1;
  for(let w=0;w<14;w++){const wd=addDays(start,w*7),m=parse(wd).getMonth();if(m!==lastM){mlab+=`<text class="ax" x="${L+w*(cs+gp)}" y="10">${MONTHS[m].slice(0,3)}</text>`;lastM=m}
   for(let d=0;d<7;d++){const ds=addDays(start,w*7+d),l=S.logs[ds];let c="hc",tip=dLab(ds)+": ";if(ds>t){c+=" fut";tip+="por venir"}else if(l&&l.st==="done"){const lv=(l.dur||0)>=55?(l.srpe||5)>=7?4:3:(l.dur||0)>=40?2:1;c+=" h"+lv;tip+=(l.dur||0)+" min"+(l.srpe?" · dureza "+l.srpe:"")}else tip+=l?"descanso":"sin registro";if(ds===t)c+=" now";

function trendCard(){const ws=weekStartOf(todayISO()),W=[];for(let k=11;k>=0;k--){const w=addDays(ws,-7*k);let n=0,min=0,ld=0;for(let i=0;i<7;i++){const l=doneLog(addDays(w,i));if(l){n++;min+=l.dur||0;ld+=l.load||0}}W.push({w,n,min,ld})}

function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function artFor(ses){const n=(ses&&ses.day&&ses.day.n||"").toLowerCase();if(/pierna|cuesta/.test(n))return ART.bar;if(/motor|carrera|paseo/.test(n))return ART.heart;if(ses&&ses.day&&(ses.day.izzy!=null||ses.day.calm))return ART.kb;return ART.db}
const FIRMAS=["Vamos","Sin excusas","A muerte","Hoy sí","Dale duro","Aguanta","Más fuerte"];
function firmaHoy(d){return FIRMAS[(parse(d).getDate()+parse(d).getMonth())%FIRMAS.length]}
function dsp(t,f,r){return`<div class="dsp"><h1>${esc(t)}</h1>${f?`<span class="firma" aria-hidden="true">${esc(f)}</span>`:""}${r?`<span class="dsp-r">${r}</span>`:""}</div>`}
function bubbles(d){const ws=weekStartOf(d),t=todayISO();return`<div class="bubbles" role="group" aria-label="Semana">${[0,1,2,3,4,5,6].map(i=>{const x=addDays(ws,i),l=S.logs[x];return`<button class="bub${l&&l.st==="done"?" done":""}${x===t?" today":""}${x===d?" view":""}" data-day="${x}" aria-label="${DAYS_L[i]} ${parse(x).getDate()}"><small>${DAYS[i].slice(0,1)}</small><b>${parse(x).getDate()}</b><i></i></button>`}).join("")}</div>`}
function slider(){return`<div class="slide" role="button" tabindex="0" aria-label="Desliza para empezar la sesión" data-slide><span class="fillk"></span><span class="knob"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span><span class="lbl">Desliza para empezar</span></div>`}
function initSlide(){const el=document.querySelector("[data-slide]");if(!el||el._ok)return;el._ok=1;const kn=el.querySelector(".knob"),fk=el.querySelector(".fillk");let x0=0,dx=0,on=false,max=0;
  const set=v=>{kn.style.transform=`translateX(${v}px)`;fk.style.width=(64+v)+"px"};
  el.addEventListener("pointerdown",e=>{on=true;dx=0;x0=e.clientX;max=el.clientWidth-64;el.classList.add("drag");try{el.setPointerCapture(e.pointerId)}catch(_){}buzz(10)});
  el.addEventListener("pointermove",e=>{if(!on)return;dx=Math.max(0,Math.min(max,e.clientX-x0));set(dx)});
  const end=()=>{if(!on)return;on=false;el.classList.remove("drag");if(dx>=max*.82){set(max);buzz([12,40,30]);setTimeout(()=>startGo(false),180)}else{if(dx<6){el.classList.remove("nudge");void el.offsetWidth;el.classList.add("nudge")}set(0)}};
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
  el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();startGo(false)}})}
function spark(vals){const mx=Math.max(...vals,1),w=64,h=24,P=vals.map((v,i)=>[i*w/(vals.length-1||1),h-2-(v/mx)*(h-4)]);return`<svg class="spk" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${smoothPath(P,h)}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"/></svg>`}

const GROUP={hombro:"hombro",pecho:"empuje",triceps:"empuje",espalda:"tiron",biceps:"tiron",trapecio:"tiron",antebrazo:"tiron",cuadriceps:"pierna",isquios:"pierna",gluteo:"pierna",gemelo:"pierna",aductor:"pierna",lumbar:"pierna",core:"core",full:"pierna"};

function weeklyVolume(lw){

  Object.entries(agg).forEach(([g,a])=>{if(a.n<3)return;const cur=S.vol[g]||0,pt=(a.f-a.d)/a.n;let dv=pt>=.5&&a.d===0?2:pt>=.25?1:pt<=-.5?-2:pt<=-.25?-1:0;const nv=Math.max(-3,Math.min(4,cur+dv));if(nv!==cur){S.vol[g]=nv;ch.push([g,nv-cur])}});

  for(let w=addDays(ws,-7);first&&w>=weekStartOf(first);w=addDays(w,-7)){if(weekDone(w)>=5&&counting)streak++;else counting=false}
  if(weekDone(ws)>=5)streak++;
  return{total,streak,now:weekDone(ws),count:Object.values(S.logs).filter(l=>l.st==="done").length};
}

/* ============ Niveles de atleta (escalera de variantes alcanzada) ============ */
function levels(){
  const ids=new Set();PLAN.forEach(d=>d.long.forEach(r=>{const p=parseItem(r);if(p.id)ids.add(p.id)}));
  const acc={};
  ids.forEach(id=>{ensureEx(id);const e=EX[id];if(!e||e.k==="p"||e.u==="min")return;const g=GROUP[muscleOf(id)];if(!g)return;const p=prog(id),span=Math.max(1,e.r[1]-e.r[0]);
    let v=(p.vi+Math.min(1,(p.t-e.r[0])/span))/e.v.length;v=Math.min(1,v+((S.prog[id]||{}).kg||0)/25);
    (acc[g]||(acc[g]=[])).push(v)});
  const out=["hombro","empuje","tiron","pierna","core"].map(g=>{const a=acc[g]||[0];return[g,1+Math.floor(9*a.reduce((s,x)=>s+x,0)/a.length)]});
  out.push(["motor",1+Math.floor(9*(runLevel()-1)/11)]);
  return out;
}

function pathCard(){
  const ws=weekStartOf(todayISO()),W=[];for(let k=11;k>=0;k--){const s=addDays(ws,-7*k);let v=0;for(let i=0;i<7;i++){const l=S.logs[addDays(s,i)];if(l&&l.load)v+=l.load}W.push({s,v})}
  if(!W.some(w=>w.v))return`<div class="card"><h2>Camino de carga</h2><p class="empty">Tu carga semanal (dureza × minutos) aparecerá aquí con tu banda habitual cuando respondas las encuestas.</p></div>`;
  const prev=W.slice(5,11).map(w=>w.v).filter(v=>v>0),m=prev.length?prev.reduce((a,x)=>a+x,0)/prev.length:0,sd=prev.length>1?Math.sqrt(prev.reduce((a,x)=>a+(x-m)**2,0)/prev.length):m*.2;
  const Wd=320,H=130,max=Math.max(...W.map(w=>w.v),m+sd,1),bw=18,x=i=>26+i*((Wd-34)/11),y=v=>H-18-(v/max)*(H-30);
  const band=m?`<rect x="20" y="${y(m+sd)}" width="${Wd-20}" height="${Math.max(2,y(Math.max(0,m-sd))-y(m+sd))}" fill="var(--acc)" opacity=".1"/><line x1="20" x2="${Wd}" y1="${y(m)}" y2="${y(m)}" stroke="var(--acc)" stroke-dasharray="3 4" opacity=".6"/>`:"";
  const bars=W.map((w,i)=>`<rect x="${x(i)-bw/2}" y="${y(w.v)}" width="${bw}" height="${Math.max(1.5,H-18-y(w.v))}" rx="3" fill="${i===11?"var(--acc)":"var(--fg3)"}"/>`).join("");
  const labs=[0,6,11].map(i=>`<text x="${x(i)}" y="${H-4}" text-anchor="middle" font-size="9" fill="var(--fg3)">${parse(W[i].s).getDate()}/${parse(W[i].s).getMonth()+1}</text>`).join("");
  const st=loadStats(addDays(todayISO(),1));
  return`<div class="card"><h2>Camino de carga</h2><svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Carga semanal de las últimas 12 semanas con tu banda habitual" style="width:100%;height:auto">${band}${bars}${labs}</svg>
   <div class="legend"><span><i style="background:var(--acc);opacity:.35"></i>tu banda habitual (6 semanas)</span><span><i style="background:var(--acc)"></i>esta semana</span></div>
   <div class="kpis"><div><b class="num">${Math.round(W[11].v)}</b><span>carga esta semana (UA)</span></div><div><b class="num">${st.wow==null?"–":(st.wow>0?"+":"")+Math.round(st.wow*100)+" %"}</b><span>vs semana anterior</span></div><div><b class="num">${st.mono?st.mono.toFixed(1):"–"}</b><span>monotonía</span></div></div>
   <p class="sub" style="font-size:12px">Orientativo: carga = dureza × minutos (Foster). Solo se usa para no subir volumen cuando te sales de tu banda.</p></div>`;
}

function phaseWord(id,k){

  if(k==="ecc")return PULL.has(id)?"Controla":"Baja";

function repSegs(i,reps,label){
  const e=i.e,out=[];
  const fixed=POWER[i.id]||REPSEC[i.id];
  if(fixed){for(let r=1;r<=reps;r++)out.push({ph:"work",d:fixed[0],big:fixed[1],rep:r,reps,rs:true,tone:TONE.work,label,rd:fixed[0],off:0});return out}
  const PZ=[[0,1],[1,1],[1,0],[0,0]];
  const tp=tempoOf(e);
  const order=CON_FIRST.has(i.id)?[["con",2],["top",3],["ecc",0],["iso",1]]:[["ecc",0],["iso",1],["con",2],["top",3]];
  for(let r=1;r<=reps;r++){
    let first=true,off=0;const rd=tp.reduce((a,x)=>a+x,0);
    order.forEach(([k,j],oi)=>{if(tp[j]>0){out.push({ph:k,d:tp[j],big:phaseWord(i.id,k),rep:r,reps,tone:TONE[k],label,rs:first,pz:PZ[oi],rd,off,tp:order.map(([kk,jj])=>[kk,tp[jj]]).filter(x=>x[1]>0)});off+=tp[j];first=false}});
  }
  return out;
}
function setSegs(i,s){
  const e=i.e,t=targetOf(i),side=SIDE[e.u];
  let block;
  if(e.u==="s"||e.u==="s/lado")block=()=>[{ph:"hold",d:t,big:"Aguanta",cd:true}];
  else if(e.u==="m/lado")block=()=>[{ph:"hold",d:Math.round(t*1.2),big:"Camina",cd:true,txt:t+" metros"}];
  else if(e.u==="min"){const o=[];for(let m=1;m<=t;m++)o.push({ph:"hold",d:60,big:"Minuto "+m,cd:true,txt:"5 remos · 5 rumanos · 5 frontales · 5 press"});block=()=>o}
  else block=lab=>repSegs(i,t,lab);
  let segs=[];
  if(i.myo){
    segs=repSegs(i,t,"Activación");
    for(let k=1;k<=4;k++){segs.push({ph:"rest",mini:true,d:15,big:"Respira",cd:true,txt:"5 respiraciones profundas"});segs=segs.concat(repSegs(i,4,"Mini-serie "+k))}

    segs=block(side==="lado"?"Lado derecho":side==="pierna"?"Pierna derecha":"Brazo derecho")

      .concat(block(side==="lado"?"Lado izquierdo":side==="pierna"?"Pierna izquierda":"Brazo izquierdo"));
  }else segs=block("");

  return segs.map(x=>Object.assign({ex:i,set:s,of:i.sets},x));
}

      grp++});return}

    const rest=multi?(hasC?60:45):Math.min(Math.max(...gr.items.map(i=>i.e.rest||0))||60,hasC?75:45);
    for(let s=1;s<=maxS;s++){
      const round=gr.items.filter(i=>i.sets>=s);
      round.forEach((i,j)=>{
        const prev=T[T.length-1];
        if(j>0)push({ph:"switch",d:12,big:"Cambia",ex:i,set:s,of:i.sets,cd:true});
        else if(!prev||prev.ph!=="rest")push({ph:"prep",d:12,big:"Prepárate",ex:i,set:s,of:i.sets,cd:true});

function finalizeT(T){
  for(let k=T.length-1,nx="Vuelta a la calma";k>=0;k--){const s=T[k];s.next=nx;if(s.ex&&s.ph!=="rest")nx=exName(s.ex.e,s.ex.p.vi)+(s.of>1?" · serie "+s.set+" de "+s.of:"");else if(s.ph==="run"||s.ph==="walk")nx=s.txt;else if(s.ph==="list")nx=s.big;else if(s.title)nx=s.title}
  let c=0;T.forEach(s=>{s.at=c;c+=s.d});T.total=c;
}
/* Ajuste exacto a 30/45/60 min: estira descansos (hasta +35 %), añade movilidad y el último segundo lo absorbe la vuelta a la calma */
function fitExact(T,target){
  let gap=target-T.reduce((a,s)=>a+s.d,0);
  if(gap>0){
    const rests=T.filter(s=>s.ph==="rest"&&!s.mini),rt=rests.reduce((a,s)=>a+s.d,0);
    if(rt>0){const add=Math.min(gap,Math.round(rt*.1));let used=0;rests.forEach(s=>{const x=Math.floor(add*s.d/rt/5)*5;s.d+=x;used+=x});gap-=used}
    let ci=T.findIndex(s=>s.cool),k=0;const g0=T[ci].grp;
    while(gap>=45){const d=Math.min(120,gap);T.splice(ci+k,0,{ph:"list",d,big:"Movilidad",txt:MOB[k%MOB.length],cd:true,grp:g0-.5+k*.01});gap-=d;k++}
    T[T.length-1].d+=gap;
  }else if(gap<0){
    for(const s of T.filter(x=>x.ph==="list"||(x.ph==="hold"&&(x.warm||x.cool))).reverse()){if(gap>=0)break;const cut=Math.min(s.d-15,-gap);if(cut>0){s.d-=cut;gap+=cut}}
  }
}

function sglide(at,f1,f2,ms,vol){try{if(!actx)return;const t=actx.currentTime+Math.max(0,at),d=ms/1000,o=actx.createOscillator(),g=actx.createGain();o.type="triangle";o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.setValueAtTime(vol,t+d*.7);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d+.03);SCHED.push(o)}catch(e){}}
function clearSched(){SCHED.forEach(o=>{try{o.stop()}catch(e){}});SCHED=[]}
function scheduleSeg(s,prev){
  clearSched();const lag=(Date.now()-G.segStart)/1000;
  const tempo=["ecc","iso","con","top","work"].includes(s.ph);
  /* Tonos que se entienden sin mirar: bajar = tono que baja, subir = tono que sube, mantener = toque suave */
  if(tempo&&lag<.3){
    const len=Math.min(450,s.d*1000*.6);
    if(s.ph==="ecc")sglide(0,660,330,len,.16);
    else if(s.ph==="con")sglide(0,360,760,Math.min(380,len),.18);
    else if(s.ph==="work")sbeep(0,880,140,.2);
    else sbeep(0,520,70,.08);
  }
  if(s.cd){
    if(s.d>=4)[3,2,1].forEach(n=>{const at=s.d-n-lag;if(at>=0)sbeep(at,784,110,.14)});
    const at=s.d-lag;if(at>=0)sbeep(at,1046,420,.22);
  }
}

  const changes=[];
  Object.keys(SV.swap).forEach(o=>{if(!SV.swap[o])return;const old=EX[SUB(o)].n,used=new Set(Object.values(S.swap)),day=new Set(PLAN[dow(SV.date)].long.concat(PLAN[dow(SV.date)].short).map(r=>parseItem(r).id).filter(Boolean));const alt=alternatives(o,day).find(x=>!used.has(x)&&x!==SUB(o));if(alt){ensureEx(alt);S.swap[o]=alt;changes.push({t:"Nuevo ejercicio: "+EX[alt].n,s:"Sustituye a "+old+"."})}});

/* ============ Modelo de carga (sRPE × minutos, Foster 2001) ============ */
function loadSeries(end,days){const out=[];for(let i=days-1;i>=0;i--){const l=S.logs[addDays(end,-i)];out.push(l&&l.st==="done"&&l.load?l.load:0)}return out}
function ewma(arr,n){const l=2/(n+1);let v=0;return arr.map(x=>v=x*l+v*(1-l))}
function loadStats(date){
  const arr=loadSeries(addDays(date,-1),56),A=ewma(arr,7),C=ewma(arr,28);
  const a=A[A.length-1],c=C[C.length-1],w=arr.slice(-7),mean=w.reduce((s,x)=>s+x,0)/7,sd=Math.sqrt(w.reduce((s,x)=>s+(x-mean)**2,0)/7);
  const mono=sd>0?mean/sd:0,n=Object.values(S.logs).filter(l=>l.load).length;
  const prev=loadSeries(addDays(date,-8),7).reduce((x,y)=>x+y,0),wk=w.reduce((x,y)=>x+y,0);
  return{a,c,wow:prev>0?wk/prev-1:null,mono,week:mean*7,strain:mean*7*mono,n};
}
function autoReason(date){
  if(S.noauto[date])return null;
  const prev=[];for(let i=1;i<=10&&prev.length<3;i++){const l=S.logs[addDays(date,-i)];if(l&&l.st==="done"&&l.srpe)prev.push(l)}
  if(prev.length>=2&&prev[0].srpe>=9&&prev[1].srpe>=9)return"Tus dos últimas sesiones fueron de 9 o más sobre 10.";
  if(prev.length>=3&&prev.filter(l=>l.energy==="baja").length>=2)return"Llegaste con energía baja a 2 de tus 3 últimas sesiones.";
  const st=loadStats(date);
  {const arr=loadSeries(addDays(date,-1),84),A7=ewma(arr,7).pop(),A42=ewma(arr,42).pop();let low=0;for(let i=1;i<=7;i++){const c=S.checkin[addDays(date,-i)];if(c&&readiness(addDays(date,-i)).score<60)low++}
   if(st.n>=14&&A42>0&&A7>1.3*A42&&low>=3)return"Tu carga reciente está muy por encima de tu media de 6 semanas y tu disposición lleva varios días baja.";}
  if(st.n>=7&&st.mono>2)return"Monotonía alta ("+st.mono.toFixed(1)+"): todas las sesiones de la semana han sido igual de duras.";
  return null;
}
function jointCount(j,date){let n=0;for(let i=1;i<=7;i++){const l=S.logs[addDays(date,-i)];if(l&&l.joints&&l.joints.includes(j))n++}return n}

/* ============ Ajuste de la sesión al tiempo elegido ============ */
function fitSession(ses){
  const target=ses.target,tot=()=>buildTimeline(ses,true).total;let guard=0;
  ses.runScale=1;
  while(tot()>target&&guard++<60){const k=ses.items.map((x,i)=>x.opt?i:-1).filter(i=>i>=0).pop();if(k===undefined)break;ses.items.splice(k,1)}
  while(tot()>target&&guard++<300){let cut=false;for(let i=ses.items.length-1;i>=0;i--){const it=ses.items[i];if(!it.id||it.myo)continue;const min=it.g==="A"&&it.e.k==="c"?2:1;if(it.sets>min){it.sets--;cut=true;break}}if(!cut)break}
  while(tot()>target&&guard++<360){const idx=ses.items.map((x,i)=>x.id||x.mob?i:-1).filter(i=>i>=0);if(idx.length<=1)break;ses.items.splice(idx[idx.length-1],1)}
  if(tot()>target){const T=buildTimeline(ses,true),rs=T.filter(s=>s.ph==="run"||s.ph==="walk").reduce((a,s)=>a+s.d,0);if(rs>0)ses.runScale=Math.max(.3,(rs-(T.total-target))/rs)}
  let added=true;while(added&&guard++<500){added=false;for(const it of ses.items){if(!it.id||it.myo||it.e.k==="p"||it.e.u==="min"||!/^[AB]$/.test(it.g))continue;const cap=ses.ph.k==="desc"||ses.tired||it.soft||ses.ph.k==="vuelta1"?it.base:it.base+1;if(it.sets<cap){it.sets++;if(tot()<=target){added=true;break}it.sets--}}}
}

/* ============ Historial y carga en Progreso ============ */
function loadCard(){
  const t=todayISO(),arr=loadSeries(t,56),A=ewma(arr,7).slice(-28),C=ewma(arr,28).slice(-28),L=arr.slice(-28);
  if(!L.some(x=>x>0))return`<div class="card"><h2>Carga de entrenamiento</h2><p class="empty">Se calcula con la encuesta: dureza (1–10) × minutos. Aparecerá tras tu primera sesión.</p></div>`;
  const st=loadStats(addDays(t,1)),W=320,H=130,max=Math.max(...L,...A,...C,1),x=i=>24+i*(W-30)/27,y=v=>H-18-(v/max)*(H-30);
  const bars=L.map((v,i)=>v?`<rect x="${x(i)-3.5}" y="${y(v)}" width="7" height="${H-18-y(v)}" rx="1.5" fill="var(--muted)" opacity=".35"/>`:"").join("");
  const line=(S2,c,w)=>`<polyline fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="round" points="${S2.map((v,i)=>x(i).toFixed(1)+","+y(v).toFixed(1)).join(" ")}"/>`;
  const lab=[0,13,27].map(i=>`<text x="${x(i)}" y="${H-4}" text-anchor="middle" font-size="9" fill="var(--muted)">${parse(addDays(t,i-27)).getDate()}/${parse(addDays(t,i-27)).getMonth()+1}</text>`).join("");
  const pct=st.wow==null?"–":(st.wow>0?"+":"")+Math.round(st.wow*100)+" %",z=st.wow==null?"":st.wow>.2?"subida brusca":st.wow<-.3?"semana suave":"estable";
  return`<div class="card"><h2>Carga de entrenamiento</h2>
   <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Carga diaria y medias de 7 y 28 días" style="width:100%;height:auto"><line x1="22" x2="${W}" y1="${H-18}" y2="${H-18}" stroke="var(--line)"/>${bars}${line(C,"var(--muted)",1.5)}${line(A,"var(--accent)",2.5)}<circle cx="${x(27)}" cy="${y(A[27])}" r="3.5" fill="var(--accent)"/>${lab}</svg>
   <div class="legend"><span><i style="background:var(--accent)"></i>media 7 días</span><span><i style="background:var(--muted)"></i>media 28 días</span><span><i style="background:var(--muted);opacity:.35"></i>carga del día</span></div>
   <div class="kpis"><div><b class="num">${pct}</b><span>vs semana anterior${z?" · "+z:""}</span></div><div><b class="num">${st.mono?st.mono.toFixed(1):"–"}</b><span>monotonía</span></div><div><b class="num">${Math.round(st.week)}</b><span>carga 7 días (UA)</span></div></div>
   <p class="sub" style="font-size:12px">Carga = dureza × minutos (Foster). Medias exponenciales de 7 y 28 días. No se usa el ratio agudo:crónico (ACWR) porque la evidencia lo desaconseja: la app solo te avisa si la carga semanal sube más de un 20 % de golpe.</p></div>`;
}
function historyCard(){
  const ds=Object.keys(S.logs).filter(d=>S.logs[d].st==="done").sort().reverse().slice(0,20);
  if(!ds.length)return`<div class="card"><h2>Historial</h2><p class="empty">Cada sesión que guardes aparecerá aquí con sus ejercicios, repeticiones y valoraciones.</p></div>`;
  return`<div class="card"><h2>Historial</h2><div>${ds.map(d=>{const l=S.logs[d];return`<button class="row" data-hist="${d}"><span class="lbl">${DAYS[dow(d)].slice(0,2)}</span><div style="min-width:0"><div class="row-n">${esc(l.day||PLAN[dow(d)].n)}</div><div class="row-c">${parse(d).getDate()} ${MONTHS[parse(d).getMonth()]}${l.min?" · "+l.min+" min":""}${l.joints&&l.joints.length?" · molestia":""}</div></div><div class="row-t"><span class="num">${l.srpe||"–"}</span><small>dureza</small></div></button>`}).join("")}</div></div>`;
}
function sheetHist(d){
  const l=S.logs[d];
  const ex=(l.ex||[]).map(x=>`<li><b>${esc(x.n)}</b> · ${x.s}×${x.t} ${esc(x.u||"")}${x.l?" · "+esc(x.l):""}${x.tp?" · tempo "+esc(x.tp):""}${x.r?" · "+RATE_TXT[x.r]:""}</li>`).join("")+(l.runs||[]).map(x=>`<li><b>${esc(x.k)}</b> · ${x.m} min${x.r?" · "+RATE_TXT[x.r]:""}</li>`).join("")+(l.seqs||[]).map(x=>`<li><b>${esc(x)}</b></li>`).join("");
  $("#layer").innerHTML=`<div class="scrim" data-close><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="h-t"><div class="eyebrow">${fmtDate(d)}</div><h2 id="h-t" style="font-size:30px">${esc(l.day||PLAN[dow(d)].n)}</h2>
   <dl class="kv">${l.ph?`<dt>Fase</dt><dd>${esc(l.ph)}</dd>`:""}<dt>Duración</dt><dd>${l.min||l.dur||"–"} min</dd><dt>Dureza</dt><dd>${l.srpe?l.srpe+" · "+SRPE_TXT[l.srpe]:"–"}</dd><dt>Carga</dt><dd>${l.load?l.load+" UA":"–"}</dd><dt>Energía</dt><dd>${l.energy||"–"}</dd>${l.joints&&l.joints.length?`<dt>Molestias</dt><dd>${l.joints.map(j=>JOINTS.find(x=>x[0]===j)[1]).join(", ")}</dd>`:""}</dl>
   ${ex?`<ul class="go-list" style="margin:0;max-width:none">${ex}</ul>`:`<p class="sub">Sesión registrada sin detalle de ejercicios.</p>`}
   <div class="btns"><button class="btn" data-act="delhist" data-d="${d}" style="color:var(--warn)">Borrar este registro</button><button class="primary" style="width:auto;flex:1;min-height:48px" data-close>Cerrar</button></div></div></div>`;
}
function sheetAlts(orig){
  const cur=SUB(orig),day=new Set(sessionFor(viewDate).items.map(i=>i.id).filter(Boolean)),alts=alternatives(orig,day).slice(0,12);
  $("#layer").innerHTML=`<div class="scrim" data-close><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="a-t"><div class="eyebrow">Mismo músculo · ${esc(MUS_TXT[muscleOf(orig)]||"")}</div><h2 id="a-t" style="font-size:28px">Cambiar ${esc(EX[cur].n)}</h2>
   <div>${alts.map(id=>{ensureEx(id);const e=EX[id];return`<button class="row" data-swapto="${orig}|${id}"><span class="lbl">${e.db?"DB":"·"}</span><div style="min-width:0"><div class="row-n">${esc(e.n)}</div><div class="row-c">${esc(e.load||"")} · ${e.k==="c"?"multiarticular":e.k==="i"?"aislamiento":e.k==="core"?"core":"potencia"}</div></div><div class="row-t"><small>elegir</small></div></button>`}).join("")}</div>
   ${S.swap[orig]?`<button class="btn" data-act="unswap" data-orig="${orig}">Volver al original: ${esc(EX[orig].n)}</button>`:""}
   <p class="sub" style="font-size:12px">«DB» viene de la base abierta free-exercise-db, filtrada a tu material.</p></div></div>`;
}

/* ============ Eventos ============ */
document.addEventListener("change",e=>{if(e.target&&e.target.id==="pfname"){S.settings.name=e.target.value.trim().slice(0,18);save()}if(e.target&&e.target.id==="vozfiles"&&e.target.files.length){vozSave([...e.target.files]).then(n=>{toast(n+" audios cargados. Pulsa el altavoz de arriba para probar.");render()})}});
document.querySelector(".tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;if(tab!==b.dataset.tab){G_TABCHANGE=true;buzz(8)}tab=b.dataset.tab;if(tab==="hoy")viewDate=todayISO();render();window.scrollTo(0,0)});
document.addEventListener("click",e=>{
  const t=e.target;
  if((t.matches("[data-close]")&&!t.closest(".sheet"))||t.closest("button[data-close]")){closeSheet();return}
  const g=t.closest("[data-g]");
  if(g&&G){const a=g.dataset.g;
    if(a==="exit")exitGo();else if(a==="pause")togglePause();else if(a==="next")skipNext();else if(a==="prev")skipPrev();
    else if(a==="plus"){const s=G.T[G.idx];s.d+=15;let need=15;for(let k=G.T.length-1;k>G.idx&&need>0;k--){const x=G.T[k];if(x.ph==="list"){const c=Math.min(need,x.d-20);if(c>0){x.d-=c;need-=c}}}finalizeT(G.T);scheduleSeg(s,{cd:true});G.beeped={}}
    else if(a==="done"){G=null;clearInterval(tick);releaseAwake();closeSheet();render()}
    return}
  const r=t.closest("[data-rate]");if(r&&G){const[id,v]=r.dataset.rate.split("|");G.r[id]=id.startsWith("run:")?{r:v}:v;G.pend=G.pend.filter(x=>x!==id);const side=document.querySelector(".go-side");if(side)drawGo();return}
  const sv=t.closest("[data-sv]");if(sv){if(sv.dataset.sv==="save"&&SV&&SV.srpe)saveSurvey();else if(sv.dataset.sv==="done"){closeSheet();render()}return}
  const sp=t.closest("[data-srpe]");if(sp&&SV){SV.srpe=+sp.dataset.srpe;drawSurvey();return}
  const en=t.closest("[data-en]");if(en&&SV){SV.energy=en.dataset.en;drawSurvey();return}
  const jt=t.closest("[data-jt]");if(jt&&SV){const k=jt.dataset.jt;SV.joints=SV.joints.includes(k)?SV.joints.filter(x=>x!==k):SV.joints.concat(k);drawSurvey();return}
  const s2=t.closest("[data-sw2]");if(s2&&SV){const k=s2.dataset.sw2;SV.swap[k]=!SV.swap[k];drawSurvey();return}
  const rvv=t.closest("[data-rv]");if(rvv&&SV){const[id,v]=rvv.dataset.rv.split("|");SV.r[id]=id.startsWith("run:")?(v==="pain"?{r:"duro",pain:true}:{r:v}):v;drawSurvey();return}
  const cin=t.closest("[data-ci]");if(cin){const[k,v]=cin.dataset.ci.split("|");S.checkin[viewDate]=Object.assign({},S.checkin[viewDate],{[k]:+v});save();render();return}
  const hi=t.closest("[data-hist]");if(hi){sheetHist(hi.dataset.hist);return}
  const st2=t.closest("[data-swapto]");if(st2){const[o,id]=st2.dataset.swapto.split("|");S.swap[o]=id;save();closeSheet();render();return}
  const mn=t.closest("[data-min]");if(mn){S.dur[viewDate]=+mn.dataset.min;if(S.short)delete S.short[viewDate];save();render();return}
  const mo=t.closest("[data-mo]");if(mo){MOFF+=+mo.dataset.mo;render();return}
  const skg=t.closest("[data-skg]");if(skg){SKG=+skg.dataset.skg;SKSEL=null;buzz(8);render();return}
  const skn=t.closest("[data-sk]");if(skn){const[a,b]=skn.dataset.sk.split("|");SKSEL=[a,+b];buzz(8);render();return}
  const gt=t.closest("[data-goto]");if(gt){G_TABCHANGE=true;tab=gt.dataset.goto;render();window.scrollTo(0,0);return}
  const pr=t.closest("[data-prot]");if(pr){S.prot=S.prot||{};const k=todayISO();S.prot[k]=Math.max(0,(S.prot[k]||0)+(+pr.dataset.prot));buzz(10);save();render();return}
  const crb=t.closest("[data-cr]");if(crb){const[k,v]=crb.dataset.cr.split("|");CR[k]=v;CT.clear();render();return}
  if(t.closest("[data-testvoice]")){unlockAudio();setTimeout(()=>say((duro()?SG(DU_PREP):sarge()?SG(SG_PREP):"Prueba de voz.")+" Si me oyes, la voz funciona.",{urgent:1}),400);return}
  const co=t.closest("[data-coach]");if(co){S.settings.coach=co.dataset.coach;save();render();say(co.dataset.coach==="duro"?SG(DU_PREP):SG(SG_PREP),{urgent:1});return}
  const sq=t.closest("[data-seqref]");if(sq){sheetSeq(sq.dataset.seqref);return}
  const oc=t.closest("[data-ownclear]");if(oc){clearOwn(oc.dataset.ownclear).then(()=>{sheetEx(oc.dataset.ownclear);render()});return}
  const dm=t.closest("[data-defmin]");if(dm){S.settings.dur=+dm.dataset.defmin;save();render();return}
  const ex=t.closest("[data-ex]");if(ex){sheetEx(ex.dataset.ex,ex.dataset.orig);return}
  const rn=t.closest("[data-run]");if(rn){sheetRun(+rn.dataset.run);return}
  const dy=t.closest("[data-day]");if(dy){viewDate=dy.dataset.day;tab="hoy";render();window.scrollTo(0,0);return}
  const eq=t.closest("[data-eq]");if(eq){equipChange(eq.dataset.eq);return}
  const sw=t.closest("[data-sw]");if(sw){S.settings[sw.dataset.sw]=!S.settings[sw.dataset.sw];save();render();return}
  const a=t.closest("[data-act]");if(!a)return;const act=a.dataset.act;
  if(act==="go")startGo(false);
  if(act==="resume")startGo(true);
  if(act==="discard"){S.live=null;save();render()}
  if(act==="settings"){tab="ajustes";render();window.scrollTo(0,0)}
  if(act==="back"){tab="hoy";render()}
  if(act==="today"){viewDate=todayISO();render()}
  if(act==="alts"){sheetAlts(a.dataset.orig);return}
  if(act==="unswap"){delete S.swap[a.dataset.orig];save();closeSheet();render();return}
  if(act==="noauto"){if(S.noauto[viewDate])delete S.noauto[viewDate];else S.noauto[viewDate]=true;save();render();return}
  if(act==="maint"){const w=weekStartOf(todayISO());S.maint=S.maint||[];if(S.maint.includes(w))S.maint=S.maint.filter(x=>x!==w);else S.maint.push(w);save();render();return}
  if(act==="pulltest"){const v=parseInt($("#pullmax").value,10);if(!isNaN(v)&&v>=0){applyPullTest(v);save();render()}return}
  if(act==="test"){sheetTest();return}
  if(act==="savetest"){const o={};TESTS.concat(MEAS).forEach(([k])=>{const v=$("#t-"+k).value.trim();if(v)o[k]=v});if(Object.keys(o).length){S.tests[todayISO()]=o;save()}closeSheet();tab="progreso";render();return}
  if(act==="toggleready"){S.ui.ready=!S.ui.ready;save();render();return}
  if(act==="repok"){S.repSeen[weekStartOf(todayISO())]=true;save();render();return}
  if(act==="svmore"){if(SV){SV.more=!SV.more;drawSurvey()}return}
  if(act==="delhist"){delete S.logs[a.dataset.d];save();closeSheet();render();return}
  if(act==="did"){openSurvey(viewDate,sessionFor(viewDate),{},durOf(viewDate));return}
  if(act==="skip"){S.logs[viewDate]={st:"skip"};save();render()}
  if(act==="tired"){if(S.tired[viewDate])delete S.tired[viewDate];else S.tired[viewDate]=true;save();render()}
  if(act==="undo"){delete S.logs[viewDate];save();render()}
  if(act==="saveload"){const id=a.dataset.id;S.prog[id]=Object.assign({},S.prog[id],{load:$("#load").value.trim()||EX[id].load});save();closeSheet();render()}
  if(act==="varback"){const id=a.dataset.id;const p=Object.assign({},S.prog[id]);p.vi=Math.max(0,(p.vi||0)-1);p.t=EX[id].r[1];p.hits=0;p.maxed=false;S.prog[id]=p;save();closeSheet();render()}
  if(act==="csv"){csvExport();return}
  if(act==="elsave"){const v=($("#elkey")||{}).value||"";if(v.trim().length<20){toast("Esa clave parece incompleta.");return}try{localStorage.setItem("entreno-el-key",v.trim())}catch(e){}toast("Clave guardada en este dispositivo.");render();return}
  if(act==="eldel"){try{localStorage.removeItem("entreno-el-key")}catch(e){}S.settings.ellive=false;save();render();return}
  if(act==="elgen"){unlockAudio();elGenAll();render();return}
  if(act==="vozlist"){const l=$("#vozlist");if(l)l.hidden=!l.hidden;return}
  if(act==="vozclear"){vozClear().then(()=>{toast("Audios quitados: vuelve la voz del sistema.");render()});return}

  if(act==="reto"){const ws=weekStartOf(viewDate),inp=document.getElementById("retov"),v=(inp&&inp.value||"").trim();if(!v){toast("Escribe tu marca antes de guardar.");return}S.retos=S.retos||{};S.retos[ws]={k:retoOf(viewDate).k,v,d:viewDate};save();toast("Reto superado. Marca guardada: "+v);render();return}
  if(act==="export"){const txt=JSON.stringify(S);const m=$("#msg");navigator.clipboard.writeText(txt).then(()=>m.textContent="Copia copiada. Guárdala en Notas.").catch(()=>{$("#imp").hidden=false;$("#impt").value=txt;$("#impt").select();m.textContent="Selecciona el texto y cópialo."})}
  if(act==="showimport"){$("#imp").hidden=false;$("#impt").value="";$("#impt").focus()}
  if(act==="import"){try{const o=JSON.parse($("#impt").value);if(!o.logs||!o.settings)throw 0;S=normalize(o);save();$("#msg").textContent="Copia restaurada.";setTimeout(render,700)}catch(err){$("#msg").textContent="Ese texto no es una copia de Entreno OS. Pega la copia completa."}}
  if(act==="reset1"){$("#reset2").hidden=false}
  if(act==="reset0"){$("#reset2").hidden=true}
  if(act==="reset"){S=defaults();save();render()}
});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset&&t.dataset.ld&&SV)SV.ld[t.dataset.ld]=t.value});
document.addEventListener("change",async e=>{const op=e.target.dataset&&e.target.dataset.ownphoto;if(op&&e.target.files&&e.target.files[0]){const[id,n]=op.split("|");try{await saveOwn(id,+n,e.target.files[0])}catch(er){}sheetEx(id);render();return}if(e.target.id==="start"&&e.target.value){S.settings.start=e.target.value;save();render()}if(e.target.dataset&&"hora" in e.target.dataset&&/^\d{1,2}:\d{2}$/.test(e.target.value)){S.settings.hora=e.target.value;save();render()}});

{const _fs=finishSession;finishSession=function(){const b=rankOf(doneCount()).i,r=_fs.apply(this,arguments),a=rankOf(doneCount());
  if(a.i>b){const d=document.createElement("div");d.className="rankup";d.innerHTML=`<div>${rankBadge(a.i).replace('width="18" height="18"','width="64" height="64"')}<small>ASCENSO</small><b>${a.name}</b></div>`;document.body.appendChild(d);setTimeout(()=>d.remove(),3200);
    if(sarge())setTimeout(()=>say("¡Ascenso! A partir de hoy eres "+a.name.toLowerCase()+". ¡Firmes!",{urgent:1}),900)}return r}}
function toast(html,ms){const d=document.createElement("div");d.className="toast";d.innerHTML=html;document.body.appendChild(d);setTimeout(()=>d.remove(),ms||5200)}
{const _fs2=finishSession;finishSession=function(date){const w=_fs2.apply(this,arguments)||[];try{S.adapt=Array.isArray(S.adapt)?S.adapt:[];S.adapt.unshift({d:date,k:"ses",w:w.map(x=>({t:x.t,s:x.s}))});S.adapt=S.adapt.slice(0,80)}catch(e){}return w}}
function weekItemsIds(){const ws=weekStartOf(todayISO()),ids=new Set();for(let i=0;i<14;i++){const d=addDays(ws,i);try{sessionFor(d).items.forEach(x=>{if(x.id)ids.add(x.orig||x.id)})}catch(e){}}return ids}
function equipChange(k){const before={};weekItemsIds().forEach(id=>before[id]=1);const q=S.equip;q[k]=!q[k];const was={...q,[k]:!q[k]};
  const ch=[];Object.keys(EX).forEach(id=>{const a=(()=>{const o=S.equip;S.equip=was;const r=SUB(id);S.equip=o;return r})(),b=SUB(id);if(a!==b&&before[id]){ensureEx(a);ensureEx(b);ch.push(EX[a].n+" → "+EX[b].n)}});
  S.adapt=Array.isArray(S.adapt)?S.adapt:[];S.adapt.unshift({d:todayISO(),k:"eq",w:[{t:(q[k]?"Material añadido: ":"Material retirado: ")+(EQN_TXT[k]||k),s:ch.length?ch.join(" · "):"El plan se recalcula con el material que tienes."}]});
  save();render();toast(`<b>${q[k]?"Material añadido":"Material retirado"}: ${EQN_TXT[k]||k}</b><br>${ch.length?"Cambios en tu plan: "+ch.map(esc).join(" · "):"El plan ya está recalculado."}`)}
const EQN_TXT={banco:"banco de press",dominadas:"barra de dominadas",anillas:"anillas",cargables:"agarres cargables",chaleco:"cinturón de lastre o chaleco"};

(async()=>{
  try{
    if(!window.claude||!claude.use)return;
