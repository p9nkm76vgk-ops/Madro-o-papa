<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ECECEE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Entreno">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180-v3.png">
<link rel="icon" href="icon-192-v3.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Entreno OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Ignición: tema oscuro único y deliberado. Un solo acento naranja para lo activo; verde/ámbar/rojo solo para la disposición.
   Layout: columna de 760 px; 3 pestañas abajo en móvil, rail lateral en iPad. Números en Barlow Condensed, interfaz en Inter Tight. */
:root{
  --bg:#0B0B0D; --s1:#141417; --s2:#1C1C21; --s3:#26262C; --line:#2E2E35;
  --fg:#F5F5F7; --fg2:#A1A1AA; --fg3:#6B6B73;
  --acc:#e6bde1; --acc2:#d9b6d8; --acc3:#c79bc3; --acc-soft:rgba(217,173,82,.16); --on-acc:#FFFFFF;
  --ok:#34D399; --mid:#FBBF24; --bad:#F43F5E;
  --ph-ecc:#38BDF8; --ph-iso:#E5E7EB; --ph-con:#FF3D71; --ph-top:#FFD23F;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-ui:"Inter Tight",-apple-system,system-ui,"Segoe UI",sans-serif;
  --r:16px; color-scheme:dark;
  --warn:var(--bad); --accent:var(--acc); --muted:var(--fg2); --ink:var(--fg); --soft:var(--s2); --surface:var(--s1); --brass:var(--mid); --accent-ink:var(--on-acc);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 116px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg2)}
h1{font-family:var(--f-num);font-weight:800;font-size:52px;line-height:.92;margin:4px 0 6px;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
h2{font-family:var(--f-num);font-weight:700;font-size:22px;margin:0;text-transform:uppercase;letter-spacing:.03em}
h3{margin:0;font-size:16px;font-weight:600}
.sub{color:var(--fg2);margin:0}
.view{display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}

/* Navegación */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:6px;background:rgba(11,11,13,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.tab{flex:1;max-width:160px;min-height:54px;border:0;background:none;border-radius:14px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--fg3)}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--acc)}
@media (min-width:900px){
  .tabs{top:0;right:auto;bottom:0;width:96px;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--line);
    padding:calc(28px + env(safe-area-inset-top,0px)) 10px 24px max(10px,env(safe-area-inset-left,0px))}
  .tab{flex:none;padding:12px 4px}
  .wrap{padding-block:34px 48px;margin-left:max(120px,calc(50% - 380px + 48px))}
}

/* Elementos base */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--s2);font-size:13px;font-weight:600;color:var(--fg)}
.chip.acc{background:var(--acc-soft);color:var(--acc)} .chip.ok{color:var(--ok)} .chip.warn,.chip.brass{color:var(--mid)}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.primary{border:0;background:linear-gradient(135deg,var(--acc2),var(--acc3));color:var(--on-acc);border-radius:var(--r);min-height:62px;padding:14px 20px;font-weight:800;font-size:18px;letter-spacing:.06em;text-transform:uppercase;width:100%;display:flex;justify-content:center;align-items:center;gap:10px;font-family:var(--f-ui)}
.primary:active{transform:scale(.99)}
.primary:disabled{opacity:.4}
.secondary{border:1px solid var(--line);background:var(--s2);border-radius:var(--r);min-height:52px;padding:12px 16px;font-weight:700;width:100%}
.quiet{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
.link{border:0;background:none;color:var(--fg2);font-weight:600;font-size:14px;min-height:44px;padding:6px 2px;text-decoration:underline;text-decoration-color:var(--fg3);text-underline-offset:3px}
.btn{border:1px solid var(--line);background:var(--s2);border-radius:12px;min-height:48px;padding:10px 14px;font-weight:600}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.note{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;color:var(--fg2);font-size:14px}
.note b{color:var(--fg)}
.empty{color:var(--fg2);font-size:14px;margin:0}
.seg{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:10px;min-height:44px;padding:8px;font-weight:600;color:var(--fg2)}
.seg button[aria-pressed="true"]{background:var(--s3);color:var(--fg)}
.viewing{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--s2);border-radius:12px;padding:4px 12px;font-size:14px}
.tq{color:var(--acc);font-weight:600}

/* Filas de ejercicios */
.block{display:flex;flex-direction:column}
.block-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 2px 10px;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;min-height:64px;padding:10px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.row:hover .row-n{color:var(--acc)}
.lbl{font-family:var(--f-num);font-weight:700;font-size:16px;color:var(--fg3)}
.thumb{width:44px;height:44px;border-radius:12px;background:var(--s2);display:grid;place-items:center;position:relative}
.thumb svg{width:40px;height:40px}
.thumb b{position:absolute;top:-4px;left:-4px;font-family:var(--f-num);font-size:12px;background:var(--bg);color:var(--fg2);border:1px solid var(--line);border-radius:6px;padding:0 4px;line-height:16px}
.row-n{font-weight:600;min-width:0;overflow-wrap:anywhere}
.row-c{color:var(--fg2);font-size:13px;margin-top:1px}
.row-t{text-align:right;white-space:nowrap}
.row-t .num{font-size:24px;font-weight:700}
.row-t small{display:block;color:var(--fg3);font-size:12px}
.thin{padding:12px 2px;border-bottom:1px solid var(--line);color:var(--fg3);font-size:13px}

/* Hoy */
.ready{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;width:100%}
.ready .dial{width:92px;height:92px;position:relative}
.ready .dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.ready .dial b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-size:36px;font-weight:800}
.ready .st{font-family:var(--f-num);font-size:24px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.contrib{display:flex;flex-direction:column;gap:8px}
.contrib div{display:grid;grid-template-columns:96px 1fr 40px;gap:10px;align-items:center;font-size:13px;color:var(--fg2)}
.contrib i{display:block;height:6px;border-radius:3px;background:var(--s3);position:relative;overflow:hidden}
.contrib i s{position:absolute;top:0;bottom:0;left:50%}
.ci{display:flex;flex-direction:column;gap:10px}
.ci .row3{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:center;font-size:13px;color:var(--fg2)}
.ci .seg button{font-size:13px}
.sess{background:radial-gradient(120% 90% at 100% 0%,rgba(217,173,82,.18),transparent 60%),var(--s1);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px}
.sess .dur{font-family:var(--f-num);font-size:64px;font-weight:800;line-height:.9}
.sess .dur small{font-size:20px;color:var(--fg2);margin-left:4px}
.resume{display:flex;flex-direction:column;gap:8px;background:var(--acc-soft);border:1px solid var(--acc);border-radius:var(--r);padding:14px}
.report{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.report ul{margin:0;padding-left:1.1em;color:var(--fg2);font-size:14px}
.report li b{color:var(--fg)}

/* Plan */
.week{display:flex;flex-direction:column}
.day{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;min-height:66px;padding:12px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.day .d{font-family:var(--f-num);font-size:14px;font-weight:600;text-transform:uppercase;color:var(--fg3);line-height:1}
.day .d .num{display:block;font-size:30px;color:var(--fg)}
.day.today{background:var(--s1);border-radius:14px;border-bottom-color:transparent;padding-inline:10px;margin-inline:-10px;width:calc(100% + 20px)}
.day.today .d .num{color:var(--acc)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--s3)}
.dot.ok{background:var(--acc)}
.int{display:inline-flex;gap:2px;vertical-align:middle;margin-left:8px}
.int i{width:5px;height:11px;border-radius:1px;background:var(--s3)}
.int i.on{background:var(--acc)}
.cycle{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cycle div{border-radius:12px;padding:10px 8px;background:var(--s2);font-size:12px;color:var(--fg2);min-width:0}
.cycle div b{display:block;font-family:var(--f-num);font-size:17px;text-transform:uppercase;color:var(--fg);font-weight:700;overflow-wrap:anywhere}
.cycle div.now{background:var(--acc);color:var(--on-acc)}
.cycle div.now b{color:var(--on-acc)}
.field{display:flex;flex-direction:column;gap:8px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:14px;min-height:48px}
.switch{width:52px;height:32px;border-radius:16px;border:0;background:var(--s3);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--fg);transition:transform .2s}
.switch[aria-pressed="true"]{background:var(--acc)}
.switch[aria-pressed="true"]::after{transform:translateX(20px);background:var(--on-acc)}
input[type=date],textarea,input[type=text]{width:100%;min-height:48px;border:1px solid var(--line);background:var(--s2);color:var(--fg);border-radius:12px;padding:11px 12px;font:inherit}
textarea{min-height:90px;font-size:12px;font-family:ui-monospace,monospace}
.section-t{margin-top:10px}

/* Progreso */
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hs{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.hs .num{display:block;font-size:40px;font-weight:800;line-height:1}
.hs span{display:block;color:var(--fg2);font-size:12px;margin-top:4px}
.hs.acc .num{color:var(--acc)}
.lvls{display:flex;flex-direction:column;gap:12px}
.lvl{display:grid;grid-template-columns:86px 1fr 34px;gap:10px;align-items:center;font-size:14px}
.lvl .bar{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.lvl .bar i{height:10px;border-radius:2px;background:var(--s3)}
.lvl .bar i.on{background:var(--acc)}
.lvl .num{font-size:22px;font-weight:800;text-align:right}
.weeks{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.weeks i{aspect-ratio:1;border-radius:5px;background:var(--s2);max-width:100%}
.weeks i.ok{background:var(--acc)} .weeks i.part{background:var(--acc-soft)}
.prs{display:flex;flex-direction:column}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--fg2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpis b{display:block;font-size:28px;line-height:1}
.kpis span{font-size:12px;color:var(--fg2)}
.ladder{display:flex;gap:4px}
.ladder i{flex:1;height:10px;border-radius:3px;background:var(--s3)}
.ladder i.on{background:var(--acc)}
.vlad{display:flex;gap:3px;margin-top:4px}
.vlad i{width:14px;height:5px;border-radius:2px;background:var(--s3)}
.vlad i.on{background:var(--acc)}

/* Hojas */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--s2);width:100%;max-width:560px;border-radius:24px 24px 0 0;border:1px solid var(--line);padding:22px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:24px}}
.sheet .row{border-bottom-color:var(--s3)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--fg2)} .kv dd{margin:0;font-weight:600}
.sheet-fig{background:var(--s1);border-radius:16px;display:grid;place-items:center;padding:8px}
.sheet-fig svg{width:160px;height:160px}

/* Modo entreno */
.go{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;--ph:var(--fg3);
  padding:calc(12px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.go::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 42%,color-mix(in srgb,var(--ph) 16%,transparent),transparent 70%);pointer-events:none;transition:background .25s}
.go>*{position:relative}
.go.ph-ecc{--ph:var(--ph-ecc)} .go.ph-iso{--ph:var(--ph-iso)} .go.ph-con{--ph:var(--ph-con)} .go.ph-top{--ph:var(--ph-top)} .go.ph-work{--ph:var(--acc)}
.go.ph-rest{--ph:var(--fg3)} .go.ph-hold{--ph:var(--acc)} .go.ph-run{--ph:var(--acc)} .go.ph-walk{--ph:var(--ph-ecc)} .go.ph-prep,.go.ph-switch{--ph:var(--ph-top)} .go.ph-list{--ph:var(--fg3)}
.go-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.prog{height:4px;background:var(--s2);border-radius:2px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--acc)}
.go-body{flex:1;display:grid;grid-template-columns:1fr;align-content:center;justify-items:center;gap:14px;max-width:620px;width:100%;margin:0 auto;overflow:auto;padding-block:10px}
.go-main{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-width:0;width:100%}
.go-side{display:flex;flex-direction:column;gap:8px;text-align:center;color:var(--fg2);font-size:14px;max-width:44ch}
.go-side b{color:var(--fg)}
.go-name{font-family:var(--f-num);font-weight:800;font-size:clamp(28px,7.5vw,48px);line-height:.95;text-transform:uppercase;text-wrap:balance}
.go-cue{color:var(--fg2);max-width:42ch;margin:0 auto}
.go-tag{display:inline-block;margin:0 auto;padding:6px 12px;border-radius:10px;background:var(--acc-soft);color:var(--acc);font-weight:600;font-size:14px;max-width:44ch}
.go-list{text-align:left;margin:0 auto;padding-left:1.1em;max-width:40ch}
.go-list li{margin:5px 0}
.stage{display:flex;align-items:center;justify-content:center;gap:18px;width:100%}
.fig{width:min(24vw,140px);height:min(24vw,140px);flex:0 1 auto;min-width:0}
.fig svg{width:100%;height:100%;overflow:visible}
.fx3{width:100%;height:100%;display:block}
.fig.in .fx3{border-radius:50%}
.thumb img.fx3{width:44px;height:44px;border-radius:12px}
.sheet-fig img.fx3{width:180px;height:180px}
.ringwrap{position:relative;width:min(58vw,300px);max-width:100%;aspect-ratio:1;flex:0 0 auto}
.stage{max-width:100%}
.ringwrap.center{width:min(80vw,360px)}
.rin .fig.in{width:74%;height:74%}
.under{display:flex;align-items:baseline;justify-content:center;gap:18px;flex-wrap:wrap}
.uph{font-family:var(--f-num);font-weight:800;font-size:clamp(48px,13vw,76px);line-height:.9;text-transform:uppercase;letter-spacing:.03em;color:var(--ph);transition:color .15s}
.ureps{font-size:clamp(40px,11vw,64px);font-weight:700;color:var(--fg3);line-height:.9}
.ureps b{color:var(--fg)}
.go.final .ureps b{color:var(--acc)}
.rin .big.long{font-size:clamp(52px,14vw,96px)}
.gring{width:100%;height:100%;display:block}
.gring .rtrack{fill:none;stroke:var(--s2);stroke-width:14}
.gring .rarc{fill:none;stroke:var(--ph);stroke-width:14;stroke-linecap:round;transition:stroke .2s}
.gring .tk{stroke:var(--s3);stroke-width:5;stroke-linecap:round}
.gring .tk.done{stroke:var(--fg)} .gring .tk.cur{stroke:var(--ph)}
.rin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.rin .big{font-family:var(--f-num);font-weight:800;font-size:clamp(84px,24vw,150px);line-height:.85;font-variant-numeric:tabular-nums}
.rin .big small{font-size:.32em;color:var(--fg3);font-weight:700}
.rin .ph{font-family:var(--f-num);font-weight:800;font-size:clamp(24px,6.4vw,34px);text-transform:uppercase;letter-spacing:.06em;color:var(--ph)}
.rin .sm{font-size:13px;color:var(--fg2)}
.go.final .rin .big{color:var(--acc)}
.go.final::before{background:radial-gradient(80% 60% at 50% 42%,rgba(217,173,82,.28),transparent 70%)}
.tstrip{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tstrip span{padding:6px 10px;border-radius:10px;background:var(--s1);border:1px solid var(--line);color:var(--fg3);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.tstrip span b{font-family:var(--f-num);font-size:16px;margin-left:2px}
.tstrip span.on{background:var(--ph);color:#0B0B0D;border-color:transparent}
.go-foot{max-width:620px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.ctrls{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px}
.cbtn{min-height:68px;border-radius:var(--r);border:1px solid var(--line);background:var(--s1);display:grid;place-items:center;color:var(--fg)}
.cbtn svg{width:28px;height:28px}
.cbtn.main{background:var(--fg);color:var(--bg);border-color:transparent}
.ctrl-extra{display:flex;justify-content:center;gap:10px}
.ctrl-extra .secondary{width:auto;min-width:120px;min-height:48px}
.rate-q{font-weight:600;text-align:center}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.mrow .tr i{background:var(--acc)}.mrow.hot{background:#ffffff08;border-radius:8px}
.alog{border-left-color:var(--acc)}
.toast{background:#131114;border:1px solid #ffffff24}
/* Qué trabajas, por escrito */
.muscard{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:#131114;border:1px solid #ffffff14;border-radius:16px;padding:12px 14px}
.muscard b{display:block;color:var(--acc);font-size:16px;font-weight:700;margin-top:2px}.muscard span:not(.eyebrow){display:block;color:var(--fg);font-size:14px;margin-top:2px}
.howto{background:#131114;border:1px solid #ffffff14;border-radius:16px}
.mtag{color:var(--acc);font-weight:700}
.go-mus{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:4px 8px;margin:6px auto 0;max-width:46ch;text-align:center}
.go-mus span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg2)}.go-mus b{color:var(--acc);font-size:15px}.go-mus small{flex-basis:100%;color:var(--fg2);font-size:12px}
.go-how{color:var(--fg2);max-width:46ch;margin:8px auto 0;font-size:14px;line-height:1.5}
.refrow{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.refrow p{grid-column:1/-1;margin:2px 0 0;font-size:13px;color:var(--fg2);line-height:1.45}.refrow .pm{grid-column:1/-1;font-size:12px;color:var(--acc)}
/* Bento de Hoy */
.bento2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.bento2{grid-template-columns:1fr}}
.bc{padding:18px 20px}.bch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.lab{display:block;color:var(--fg2);font-size:.875rem;letter-spacing:.02em}.bign{display:block;font-size:2.1rem;font-weight:500;letter-spacing:-.02em;margin-top:2px;line-height:1.1}.bign small{font-size:.95rem;color:var(--fg2);font-weight:500}
.ringc{display:flex;flex-direction:row;align-items:center;gap:16px}.pring{width:104px;height:104px;flex:none}.pring .rt{fill:none;stroke:#201b20;stroke-width:10}.pring .ra{fill:none;stroke:var(--acc);stroke-width:10;stroke-linecap:round}.pring .rv{fill:var(--fg);font-size:22px;font-weight:600}.pring .rl{fill:var(--fg2);font-size:10px}
.nextc{display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer;color:var(--fg);font:inherit}.nextc b{font-size:1.25rem;font-weight:600}.nextc small{color:var(--fg2)}.nextc .nx{font-size:13px;color:var(--fg);margin-top:4px}.nextc .nm{font-size:12px;color:var(--acc)}
.qt{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}@media (max-width:560px){.qt{grid-template-columns:repeat(2,1fr)}}
.qt>div{background:var(--s1);border:1px solid #ffffff17;border-radius:18px;padding:12px 14px;box-shadow:inset 0 1px 0 #ffffff0a}.qt span{display:block;font-size:12px;color:var(--fg2)}.qt b{display:block;font-size:1.7rem;font-weight:500;line-height:1.15}.qt small{font-size:12px;color:var(--fg2)}
.pgrid{display:grid;grid-template-columns:1fr;gap:14px}@media (min-width:1100px){.pgrid{grid-template-columns:1fr 1fr}.pgrid .wide{grid-column:1/-1}}
.seg2{display:inline-flex;gap:6px;flex-wrap:wrap}.seg2 button{min-height:36px;padding:0 13px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
/* Gráficas */
.chart{width:100%;height:auto;display:block;margin-top:10px}.chart .gl{stroke:#ffffff12;stroke-dasharray:3 5}.chart .gl.z{stroke:#ffffff24;stroke-dasharray:none}.chart .ax{fill:var(--fg2);font-size:11px}.chart .ax.now{fill:var(--acc);font-weight:700}
.chart .bp{fill:var(--acc);opacity:.16}.chart .avl{stroke:var(--acc);stroke-dasharray:5 5;opacity:.55}.chart .avt{fill:var(--acc);font-size:11px}
.chart .ln{fill:none;stroke:var(--acc);stroke-width:2.6;stroke-linecap:round}.chart .dt{fill:var(--bg);stroke:var(--acc);stroke-width:2}.chart .dt.now{fill:var(--acc)}
svg.chart,svg.donut,svg.heat{touch-action:pan-y;cursor:crosshair;-webkit-user-select:none;user-select:none}
.chart .guide{stroke:var(--acc);stroke-width:1;stroke-dasharray:3 4;opacity:.7;pointer-events:none}
.chart circle.dt.hot{r:6;fill:#f6d1ef;stroke:var(--acc);stroke-width:2}
.chart g.hot rect{filter:brightness(1.3)}
.dnw{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.donut{width:150px;height:150px;flex:none}.donut .dt0{fill:none;stroke:#201b20;stroke-width:16}.donut .dn{fill:none;stroke-width:16;transition:stroke-width .12s}.donut .dn.hot{stroke-width:21}.donut .dv{fill:var(--fg);font-size:19px;font-weight:650}.donut .dl{fill:var(--fg2);font-size:10px}
.dleg{display:grid;gap:6px;flex:1;min-width:150px}.dleg div{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;font-size:13px;padding:2px 6px;border-radius:8px}.dleg div.hot{background:#ffffff0a}.dleg i{width:10px;height:10px;border-radius:3px}
.heat{width:100%;max-width:520px;height:auto;display:block;margin-top:8px}.heat .ax{fill:var(--fg2);font-size:9px}
.hc{fill:#201b20}.hc.h1{fill:#5b4a59}.hc.h2{fill:#8a6f87}.hc.h3{fill:#b99bb5}.hc.h4{fill:#e6bde1}.hc.fut{fill:transparent;stroke:#ffffff18;stroke-dasharray:2 2}.hc.now{stroke:#f6f4f6;stroke-width:1.5}.hc.hot{stroke:#f6d1ef;stroke-width:1.5}
.sheet h2{text-transform:none;color:var(--fg);font-weight:500;letter-spacing:-.01em;font-family:var(--f-ui)}
.pgrid .wide svg.chart{max-width:640px;margin-inline:auto}
.vclass>span:first-child{background:var(--acc);color:#1a0f19}
#ctip{position:fixed;z-index:95;pointer-events:none;display:flex;flex-direction:column;gap:2px;padding:8px 12px;border-radius:14px;background:#0a0a0bf2;border:1px solid #ffffff2e;box-shadow:0 14px 34px -10px #000;opacity:0;transform:translateY(4px);transition:opacity .1s,transform .1s;white-space:nowrap}
#ctip.on{opacity:1;transform:none}#ctip small{color:var(--fg2);font-size:.8rem}#ctip b{font-size:.95rem;color:var(--acc)}
/* ===================== «Niebla y Obsidiana» · v2 (nov 2026) =====================
   Estudio gris niebla, cristal esmerilado, pastillas negras, tarjetas de obsidiana con arte 3D y un único acento lila.
   Tipografía: Bebas Neue (títulos y números) · Mr Dafoe (firma) · Archivo (texto). */
:root{--bg:#ECECEE;--s1:#F7F7F8;--s2:#FFFFFF;--s3:#E4E4E8;--line:#DCDCE0;--line2:#CFCFD4;--fg:#0B0B0C;--fg2:#6E6E73;--fg3:#A1A1A6;
  --acc:#A374C7;--acc2:#D9B6D8;--acc3:#7B4E8F;--acc-soft:#A374C71f;--on-acc:#FFFFFF;--ink:#0B0B0C;--obs:#0B0B0C;
  --ok:#2E9E5B;--mid:#C98A1B;--bad:#E5484D;--r:22px;
  --f-ui:"Archivo",system-ui,sans-serif;--f-num:"Bebas Neue","Archivo Narrow",sans-serif;--f-dsp:"Bebas Neue","Archivo Narrow",sans-serif;--f-sig:"Mr Dafoe",cursive;
  --glass:rgba(255,255,255,.58);--sh:0 1px 2px rgba(20,20,30,.04),0 12px 32px -18px rgba(20,20,30,.18)}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;letter-spacing:-.005em}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;height:auto;background:
  radial-gradient(900px 600px at 0% -10%,rgba(255,255,255,.95),transparent 60%),
  radial-gradient(700px 500px at 110% 20%,rgba(163,116,199,.10),transparent 65%),
  radial-gradient(800px 600px at 50% 120%,rgba(255,255,255,.7),transparent 60%),var(--bg)}
::selection{background:var(--acc2)}
.wrap{padding-block:14px 128px}
.view{gap:14px}
h1{font-family:var(--f-dsp);font-weight:400;font-size:clamp(64px,19vw,96px);line-height:.84;letter-spacing:.005em;color:var(--fg);margin:0;text-transform:uppercase}
h2{font-family:var(--f-ui);font-weight:600;font-size:17px;letter-spacing:-.01em;color:var(--fg);text-transform:none;margin:0}
h3{font-family:var(--f-ui);font-weight:600;color:var(--fg)}
.eyebrow{font-family:var(--f-ui);font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--fg3)}
.sub,.thin{color:var(--fg2)}
.num{font-family:var(--f-num);font-weight:400;letter-spacing:.01em}
a{color:var(--acc3)}
.link{color:var(--fg);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line2)}

/* Título display + firma manuscrita */
.dsp{position:relative;padding-bottom:18px;margin:4px 0 2px}
.dsp h1{font-size:clamp(70px,21vw,104px)}
.dsp .firma{position:absolute;left:clamp(70px,30vw,190px);bottom:-6px;font-family:var(--f-sig);font-size:clamp(40px,11vw,58px);line-height:1;color:var(--acc);transform:rotate(-7deg);white-space:nowrap;pointer-events:none;text-shadow:0 2px 0 var(--bg)}
.dsp .dsp-r{position:absolute;right:0;bottom:22px;font-size:12px;color:var(--fg2);text-align:right}

/* Cabecera */
.brand{display:flex;align-items:center;gap:10px;padding:4px 0 6px;border:0;background:none;position:static}
.brand .logo{width:44px;height:44px;border-radius:50%;overflow:hidden;flex:none;background:#0B0B0C;box-shadow:0 6px 16px -8px rgba(0,0,0,.5)}
.brand .logo img{width:100%;height:100%;object-fit:cover;transform:scale(1.25)}
.brand .who{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.brand .who b{font-weight:600;font-size:15px}
.brand .rkc{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 8px 2px 6px;color:var(--fg)}
.brand .rkc i{width:6px;height:6px;border-radius:50%;background:var(--acc)}
.brand .rkc svg{width:12px;height:12px}
.ibtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:#fff;color:var(--fg);cursor:pointer;flex:none;transition:transform .15s}
.ibtn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.ibtn svg{width:20px;height:20px}
.ibtn:active,.press:active{transform:scale(.94)}

/* Superficies */
.card,.note,.report,.resume,.viewing,.vclass{background:var(--s1);border:1px solid #fff;border-radius:var(--r);box-shadow:var(--sh);color:var(--fg)}
.card{padding:18px}
.note{padding:14px 16px;font-size:14px}
.note b{color:var(--fg)}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);border:1px solid rgba(255,255,255,.85)}
.obs,.card.obs{--fg:#F5F5F7;--fg2:#A1A1A6;--fg3:#6E6E73;--line:#ffffff1f;--s1:#141316;--s2:#1C1B1F;--s3:#26252A;--acc:#D9B6D8;
  background:radial-gradient(420px 260px at 90% -10%,#2A2230,transparent 70%),#0B0B0C;border:1px solid #0B0B0C;color:var(--fg);box-shadow:0 24px 50px -24px rgba(11,11,12,.55)}
.obs h2,.obs h3,.obs b{color:var(--fg)}

/* Chips y segmentos */
.chip{background:#fff;border:1px solid var(--line);color:var(--fg);border-radius:999px;font-family:var(--f-ui);font-weight:500;font-size:12.5px;padding:5px 11px;display:inline-flex;align-items:center;gap:6px}
.chip svg{width:14px;height:14px}
.chip.acc,.sess .chip.acc{background:var(--acc-soft);border-color:transparent;color:var(--acc3)}
.chip.warn{background:#fff3df;border-color:transparent;color:#8a5a00}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.seg,.seg2{background:rgba(255,255,255,.6);border:1px solid #fff;border-radius:999px;padding:4px;display:inline-flex;gap:2px;box-shadow:inset 0 1px 2px rgba(0,0,0,.04)}
.seg button,.seg2 button{background:transparent;border:0;color:var(--fg2);border-radius:999px;min-height:34px;padding:0 14px;font:500 13.5px var(--f-ui);cursor:pointer}
.seg button[aria-pressed="true"],.seg2 button[aria-pressed="true"]{background:#fff;color:var(--fg);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.obs .seg,.obs .seg2{background:#ffffff12;border-color:#ffffff14}
.obs .seg button[aria-pressed="true"],.obs .seg2 button[aria-pressed="true"]{background:var(--acc);color:#0B0B0C}
.switch{background:var(--s3)}.switch[aria-pressed="true"]{background:var(--ink)}

/* Botones */
.primary{background:var(--ink);color:#fff;border:0;border-radius:999px;min-height:56px;font:600 16px var(--f-ui);letter-spacing:0;text-transform:none;box-shadow:0 14px 30px -16px rgba(11,11,12,.6);display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:6px 22px 6px 6px}
.primary svg{fill:currentColor}
.primary .pi{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;flex:none}
.obs .primary{background:#fff;color:var(--ink)}.obs .primary .pi{background:var(--ink);color:#fff}
.secondary,.btn{background:#fff;border:1px solid var(--line);color:var(--fg);border-radius:999px;font:500 14px var(--f-ui);min-height:44px}
.obs .secondary,.obs .btn{background:#ffffff10;border-color:#ffffff22;color:#fff}

/* Semana en burbujas */
.bubbles{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.bub{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:70px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.55);color:var(--fg);cursor:pointer;font:inherit;position:relative;transition:transform .2s}
.bub small{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--fg3)}
.bub b{font-family:var(--f-num);font-weight:400;font-size:22px;line-height:1}
.bub i{width:6px;height:6px;border-radius:50%;background:transparent}
.bub.done i{background:var(--acc)}
.bub.today{background:var(--ink);border-color:var(--ink);color:#fff}.bub.today small{color:#ffffffa0}
.bub.view:not(.today){border-color:var(--ink)}
.bub:active{transform:scale(.95)}

/* Tarjeta protagonista (sesión) */
.sess{position:relative;overflow:hidden;padding:22px;border-radius:26px;gap:12px;min-height:300px;display:flex;flex-direction:column}
.sess .art{position:absolute;right:-8%;top:-4%;width:78%;max-width:440px;pointer-events:none;-webkit-mask-image:radial-gradient(70% 70% at 55% 45%,#000 55%,transparent 100%);mask-image:radial-gradient(70% 70% at 55% 45%,#000 55%,transparent 100%);opacity:.95}
.sess .art img{width:100%;display:block}
.sess .st-k{position:relative;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#ffffff80}
.sess .st-n{position:relative;font-family:var(--f-num);font-size:48px;line-height:.9;color:#fff;margin-top:2px}
.sess .st-s{position:relative;font-size:13.5px;color:#ffffffa0}
.sess .st-m{position:relative;font-size:13px;color:var(--acc);font-weight:500;max-width:60%}
.sess .grow{flex:1;min-height:40px}
.sess .seg{position:relative;align-self:flex-start}
.sess .quiet{position:relative;display:flex;justify-content:center;gap:18px}
.sess .quiet .link{color:#ffffffb0;text-decoration-color:#ffffff40;font-weight:500;font-size:13.5px}
.sess .note{background:#ffffff10;border-color:#ffffff1c;box-shadow:none;color:#fff;position:relative}
.sess .thin{position:relative;color:#ffffffa0}
.sess .resume{position:relative;background:#ffffff10;border-color:#ffffff1c;box-shadow:none}

/* Deslizador «Desliza para empezar» */
.slide{position:relative;height:64px;border-radius:999px;background:#fff;display:flex;align-items:center;user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden;cursor:grab}
.slide .knob{position:absolute;left:6px;top:6px;width:52px;height:52px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;z-index:2;transition:transform .3s cubic-bezier(.3,1.5,.5,1);box-shadow:0 6px 14px -6px rgba(0,0,0,.6)}
.slide.drag .knob{transition:none}
.slide .knob svg{width:22px;height:22px}
.slide .fillk{position:absolute;left:0;top:0;bottom:0;width:64px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),#efe3f0);z-index:1}
.slide.drag .fillk{transition:none}.slide:not(.drag) .fillk{transition:width .3s}
.slide .lbl{flex:1;text-align:center;font-weight:600;font-size:16px;color:var(--ink);padding-left:56px;position:relative;z-index:1}
.slide .lbl::after{content:" ›››";color:var(--fg3);letter-spacing:-.1em;animation:sh 1.8s infinite}
@keyframes sh{0%,100%{opacity:.25}50%{opacity:1}}
.slide.nudge .knob{animation:ng .5s}
@keyframes ng{30%{transform:translateX(26px)}60%{transform:translateX(-4px)}}

/* Microdatos */
.qt{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:640px){.qt{grid-template-columns:repeat(4,1fr)}}
.qt>div{background:var(--s1);border:1px solid #fff;border-radius:20px;padding:14px 16px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:2px;position:relative;min-height:96px}
.qt span{font-size:12.5px;color:var(--fg2);font-weight:500}
.qt b{font-family:var(--f-num);font-weight:400;font-size:44px;line-height:.95;color:var(--fg)}
.qt small{font-size:12px;color:var(--fg2)}
.qt .spk{position:absolute;right:12px;bottom:14px;width:64px;height:24px}
.qt .up{color:var(--acc3);font-weight:600}

/* Lista de ejercicios en pastillas */
.block{display:flex;flex-direction:column;gap:8px}
.block-h{display:flex;justify-content:space-between;align-items:center;padding:6px 2px}
.block-h h2{font-family:var(--f-dsp);font-weight:400;font-size:30px;letter-spacing:.01em}
.row{background:#fff;border:1px solid var(--line);border-radius:22px;min-height:66px;padding:10px 14px 10px 10px;grid-template-columns:44px 1fr auto;box-shadow:0 1px 2px rgba(0,0,0,.03);transition:transform .15s,box-shadow .2s}
.row:active{transform:scale(.985)}
.row:hover{box-shadow:0 8px 20px -14px rgba(0,0,0,.35)}
.row-n{font-weight:600;font-size:15px;color:var(--fg)}
.row-c{color:var(--fg2);font-size:12.5px}
.row-t .num{font-size:24px;color:var(--fg)}
.row-t small{color:var(--fg3)}
.thumb{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff}
.thumb .tag{color:#fff!important;font:700 11px var(--f-ui)!important;letter-spacing:.04em}
.thumb b{background:var(--acc2);color:var(--ink);border:0;font-family:var(--f-ui);font-weight:700;font-size:10px;border-radius:999px;top:-5px;left:-5px;padding:1px 5px}
.thumb svg{filter:invert(1)}
.mtag{color:var(--acc3)}
.tq{background:var(--acc-soft);color:var(--acc3)}
.thin{font-size:12.5px;padding:2px 6px}

/* Navegación flotante */
.tabs{left:50%;right:auto;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:auto;gap:4px;padding:7px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);border:1px solid rgba(255,255,255,.9);box-shadow:0 18px 40px -18px rgba(20,20,30,.35)}
.tab{width:56px;height:56px;min-height:56px;flex:none;border-radius:50%;padding:0;color:var(--fg);font-size:0;gap:0;background:transparent;transition:background .25s,color .25s,width .3s}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{background:var(--ink);color:#fff;width:104px;border-radius:999px;font-size:13px;font-weight:600;flex-direction:row;gap:7px}
.tab[aria-current="page"] svg{color:#fff}
@media (min-width:900px){
 .tabs{left:24px;top:24px;bottom:24px;transform:none;width:220px;flex-direction:column;justify-content:flex-start;align-items:stretch;border-radius:30px;padding:20px 14px;gap:6px}
 .tabs::before{content:"ENTRENO OS";font-family:var(--f-dsp);font-size:28px;letter-spacing:.06em;padding:4px 12px 18px;color:var(--fg)}
 .tab,.tab[aria-current="page"]{width:auto;height:48px;min-height:48px;border-radius:999px;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 16px;font-size:15px;font-weight:500;max-width:none}
 .wrap{max-width:1080px;padding-left:272px;padding-right:32px;padding-block:28px 60px}
}

/* Bento */
.bento2{gap:12px}
.ringc .pring .rt{stroke:var(--s3)}.ringc .pring .ra{stroke:var(--acc)}.pring .rv{fill:var(--fg);font-family:var(--f-num);font-weight:400;font-size:28px}

function effWeek(date){const ws=weekStartOf(date),st=weekStartOf(S.settings.start);if(ws<st)return 0;let n=Math.floor(daysBetween(st,ws)/7)+1;(S.maint||[]).forEach(m=>{if(m>=st&&m<ws)n--});return n}

const DLCACHE={};
function deloadNeeded(ws,i){if(DLCACHE[ws]!=null)return DLCACHE[ws];const t=todayISO();if(ws>t){return DLCACHE[ws]=Math.floor(i/4)%2===1}
  let sig=0;const prev=addDays(ws,-14);
  let stalls=0;Object.values(S.prog||{}).forEach(p=>{if((p.dz||0)>=1)stalls++});if(stalls>=3)sig++;
  let low=0;for(let k=1;k<=7;k++){const c=S.checkin[addDays(ws,-k)];if(c&&((c.sleep||0)+(c.energy||0)-(c.sore||0)-(c.stress||0))<=-2)low++}if(low>=4)sig++;
  try{const arr=loadSeries(addDays(ws,-1),84),A7=ewma(arr,7).pop(),A42=ewma(arr,42).pop();if(A42>0&&A7>1.3*A42)sig++}catch(e){}
  let pain=0;for(let k=1;k<=14;k++){const l=S.logs[addDays(ws,-k)];if(l&&l.joints&&l.joints.length)pain++}if(pain>=2)sig++;
  return DLCACHE[ws]=sig>=2||Math.floor(i/4)%2===1}
function phaseOf(date){
  const ws=weekStartOf(date);
  if((S.maint||[]).includes(ws))return{k:"mant",w:1,...PHASES.mant};
  const w=effWeek(date);
  const duro=S.settings.duro!==false;
  if(!duro&&w<=1)return{k:"vuelta1",w:1,...PHASES.vuelta1};
  if(!duro&&w===2)return{k:"vuelta2",w:2,...PHASES.vuelta2};
  if(S.forced.includes(ws))return{k:"desc",forced:true,block:0,w:4,...PHASES.desc};
  const i=S.anchor&&ws>=S.anchor?effWeek(date)-effWeek(S.anchor):Math.max(0,w-(duro?1:3));let k=CYCLE[i%4];
  if(k==="desc"&&!deloadNeeded(ws,i))return{k:"acum",w:4,block:Math.floor(i/4)+1,skipDeload:true,...PHASES.acum,n:"Acumulación (descarga no necesaria)"};
  return{k,w:i%4+1,block:Math.floor(i/4)+1,...PHASES[k]};
}
function evaluateWeeks(){
  const ws=weekStartOf(todayISO()),lw=addDays(ws,-7);
  if(S.evald[lw]||effWeek(lw)<(S.settings.duro!==false?1:3)||lw<weekStartOf(S.settings.start))return;
  const ph=phaseOf(lw);S.evald[lw]=true;
  const vch=weeklyVolume(lw);if(vch.length)S.volLog[ws]=vch;
  if(ph.k==="desc"||ph.k==="mant"){save();return}
  let duro=0,skip=0;for(let i=0;i<7;i++){const l=S.logs[addDays(lw,i)];if(!l)continue;duro+=l.duro||0;if(l.st==="skip")skip++}
  if((duro>=3||skip>=2)&&phaseOf(ws).k!=="desc"){S.forced.push(ws);S.anchor=addDays(ws,7);S.autoDeload=ws}
  save();
}

function durOf(date){return phaseOf(date).k==="mant"?30:(S.dur[date]||(S.short&&S.short[date]?30:0)||S.settings.dur||60)}

function runLevel(){return Math.max(1,Math.min(RUN.length,Math.floor(S.run.lv)))}

/* Sprints solo con base: semana efectiva ≥ 5 y nivel de carrera ≥ 4. Antes, cuestas andando rápido. */
function sprintsUnlocked(date){return effWeek(date)>=5&&runLevel()>=4}
function sprintPlan(ph,date){
  if(!sprintsUnlocked(date))return{walk:true,n:8,s:30,r:60};
  if(ph.k==="desc")return{n:6,s:8,r:100};
  let wk=0;for(let d=addDays(weekStartOf(date),-7);d>=weekStartOf(S.settings.start)&&wk<6;d=addDays(d,-7)){if(effWeek(d)>=5)wk++}

function runPhases(kind,lv,ph,date,short){

    const[w,r,n]=kind==="intermit"?(ok?[15,15,16]:[30,30,10]):[30,90,6];
    for(let i=0;i<n;i++){o.push(ok?{t:"Correr",s:w,k:"run"}:{t:"Anda rápido en cuesta",s:w,k:"walk",fast:1});if(i<n-1)o.push({t:ok?"Para":"Andar",s:r,k:"walk"})}
    o.push({t:"Andar",s:120,k:"walk"});return o}
  if(kind==="sprint"){const sp=sprintPlan(ph,date);const o=[{t:"Andar",s:180,k:"walk"}];for(let i=0;i<sp.n;i++){o.push(sp.walk?{t:"Anda rápido en cuesta",s:sp.s,k:"walk",fast:1}:{t:"Sprint",s:sp.s,k:"run"});o.push({t:"Andar",s:sp.r,k:"walk"})}o.pop();o.push({t:"Andar",s:120,k:"walk"});return o}
  let[r,w,n]=RUN[lv-1];let reps=n,run=r;

  if(ph.k==="desc"||ph.k==="vuelta1"){if(n>1)reps=Math.max(2,reps-1);else run=Math.round(run*.75/60)*60}
  const cap=maxRecentRun(date)*1.1; // regla del 10 % sobre la salida más larga de 30 días
  const runSec=()=>reps*run;
  if(cap>0){while(runSec()>cap&&reps>2)reps--;if(runSec()>cap&&reps===1)run=Math.max(600,Math.floor(cap/60)*60)}
  if(short){const lim=17*60;while(runSec()+(reps-1)*w>lim&&reps>2)reps--;if(reps===1&&run>lim)run=lim}
  const o=[{t:"Andar",s:short?180:300,k:"walk"}];
  for(let i=0;i<reps;i++){o.push({t:"Correr",s:run,k:"run"});if(w&&i<reps-1)o.push({t:"Andar",s:w,k:"walk"})}

}
const mm=s=>s%60?(Math.floor(s/60)+":"+String(s%60).padStart(2,"0")):(s/60)+" min";
const RUN_NAME={intermit:"Resistencia intermitente",hiitcinta:"Intervalos en cuesta",paseo:"Paseo activo",sprint:"Cuestas",z2:"Carrera en zona 2",dom:"Carrera suave",fin:"Carrera extra en zona 2",cuesta:"Caminata en cuesta"};

/* Bloques de relleno: carrera suave al nivel actual o caminata en cuesta, cortados al segundo */
function finPhases(kind,sec,lv){
  if(kind==="cuesta")return[{t:"Anda en cuesta",s:sec,k:"walk"}];
  const[r,w]=RUN[lv-1],o=[];let left=sec;
  if(!w){return[{t:"Correr",s:sec,k:"run"}]}

}
function runLabel(it){

  if(it.run==="fin"){const runs=it.ph.filter(x=>x.k==="run");return mm(it.ph.reduce((a,x)=>a+x.s,0))+" suaves"+(runs.length>1?" alternando correr y andar":"")+" al final de la sesión"}
  const runs=it.ph.filter(x=>x.k==="run");
  if(it.run==="paseo")return"20 min a paso vivo";
  if(it.run==="intermit"||it.run==="hiitcinta"){const w=it.ph.filter(x=>x.k==="run"||x.fast);return w.length+" × "+w[0].s+" s "+(w[0].fast?"andando rápido en cuesta":"rápidos")}
  if(it.run==="sprint"){if(!runs.length){const f=it.ph.filter(x=>x.fast);return f.length+" × "+f[0].s+" s andando rápido en cuesta al 10–15 %"}return runs.length+" × "+runs[0].s+" s de sprint en cuesta"}
  if(runs.length===1)return mm(runs[0].s)+" seguidos a ritmo de conversación";
  const walk=it.ph.find((x,i)=>i>0&&x.k==="walk"&&i<it.ph.length-1);
  return runs.length+" × "+mm(runs[0].s)+" corriendo / "+mm(walk?walk.s:0)+" andando";
}
function SUB(id){const q=S.equip||{};let r=id;if(q.banco){if(id==="floor")r="pressb";if(id==="bulg")r="bulgara";if(id==="pullover")r="pullover";if(id==="pendlay"&&false)r="remopecho";if(id==="bayes")r="curlinc"}if(q.dominadas){if(id==="jalon1")r="dominada";if(id==="invsup")r="chinup";if(id==="lsit"||id==="revcrunch"||id==="dragon")r="colgado"}if(q.anillas){if(id==="fondos")r="fondosan";if(id==="invertido")r="remoan"}const w=S.swap&&S.swap[id];if(w){ensureEx(w);if(EX[w])r=w}return r}

  return{g:m[1],gi:m[2]||"",orig:m[3],id:SUB(m[3]),sets:m[4]?+m[4]:null,myo:!!m[5],opt:!!m[6]};
}
function rirFor(e,ph,tired){if(e.k==="p")return null;let r=e.k==="i"?ph.ri:ph.rc;if(e.nofail&&r==="0")r="1";const b=tired===true?1:(+tired||0);if(b)r=r.replace(/\d/g,d=>Math.min(4,+d+b));return r}
function techFor(e,ph){if(e.k!=="i")return null;if(ph.k==="intens")return"Al acabar la última serie, parciales en la parte estirada hasta el fallo.";if(ph.k==="pico")return e.tq||"Al acabar la última serie, parciales en la parte estirada hasta el fallo.";return null}
function sessionFor(date){
  const ph=phaseOf(date),exam=false,mant=ph.k==="mant",short=isShort(date);let day=dayFor(date);
  const rd=readiness(date),over=!!S.noauto[date],mode=S.tired[date]?"moderado":over?"listo":(rd.force&&rd.st==="listo"?"moderado":rd.st),tired=mode!=="listo",auto=!over&&rd.st!=="listo"?RD[rd.st].a:null,volUsed={};
  const jc={};Object.keys(JOINT).forEach(j=>{const n=jointCount(j,date);if(n)jc[j]=n});
  const ci=S.checkin[date]||{};

  let swapped=null;
  if(!over&&!day.calm&&day.int>=2&&rd.st==="recuperar"&&(ci.energy===-1||ci.sore===2)){swapped=day.n;day=CALM_DAYS.movil}

    if(it.run){const lv=runLevel(),p=runPhases(it.run,lv,ph,date,short);return{run:it.run,lv,ph:p}}
    let soft=false;
    for(const j in jc){if(JOINT[j].includes(it.id)){if(jc[j]>=2){const avoid=new Set(JOINT[j].concat(list.map(r=>{const p=parseItem(r);return p.id}).filter(Boolean)));const alt=alternatives(it.orig,avoid)[0];if(alt){ensureEx(alt);prot.push(EX[it.id].n+" → "+EX[alt].n);it.id=alt}}else soft=true}}

  if(!mant&&!day.calm&&(dw===0||dw===4||dw===2)&&gapNow()>=300){
    const have=new Set(ses.items.map(i=>i.id));

/* ============ Progresión por ejercicio ============ */
/* Escalera de 9 pasos cuando la carga no puede subir (informe A3): reps → series → tempo → pausa → unilateral/palanca → myo-reps → parciales → banda */

function applyLadder(i){const p=S.prog[i.id];if(!p||!p.lad||!i.e)return;const L=p.lad,iso=i.e.k==="i";

/* Autorrelleno de déficits (informe A9): de jueves a domingo, si un músculo prioritario va corto, +2 series de su aislamiento (máx. +4 por sesión) */
const PRIO={delt:1,lat:.9,rdelt:.8,abs:.75,bic:.7,tri:.7,pec:.6,quad:.5,ham:.5,glu:.5,calf:.3};

function weekFrac(ws,until,withPlan){const o={};for(let i=0;i<7;i++){const d=addDays(ws,i);if(d>=until&&!withPlan)break;let list=null;const l=S.logs[d];
   if(l&&l.st==="done"&&l.ex)list=l.ex.map(x=>({id:x.id,s:+x.s||0}));else if(withPlan&&d>=until){try{ENG_GUARD=true;list=sessionFor(d).items.filter(x=>x.id).map(x=>({id:x.id,s:+x.sets||0}))}catch(e){}finally{ENG_GUARD=false}}
   (list||[]).forEach(x=>{const mp=musOf(x.id);if(!mp)return;mp[0].forEach(r=>o[r]=(o[r]||0)+x.s);mp[1].forEach(r=>o[r]=(o[r]||0)+x.s*.5)})}return o}
function autoFill(ses,date){if(ENG_GUARD)return;const dw=dow(date),ph=ses.ph.k;if(dw<3||ph==="desc"||ph==="mant"||ph.startsWith("vuelta")||ses.day.calm||ses.tired)return;

    const it=ses.items.find(i=>i.id&&i.e&&i.e.k==="i"&&musOf(i.id)&&musOf(i.id)[0].includes(m));if(!it)return;const add=Math.min(2,4-added);it.sets=(it.sets||2)+add;added+=add;notes.push(MREG[m]+" +"+add)});

function progressExercise(id,rating,date,wins){

  }else if(p.t>before)wins.push({t:"+"+(p.t-before)+(step===5?(e.u==="m/lado"?" m":" s"):" rep"+(p.t-before>1?"s":""))+" en "+e.n,s:"La próxima vez: "+p.t});

function progressRun(rating,pain,wins){
  const before=runLevel();
  if(pain)S.run.lv=Math.max(1,S.run.lv-1);
  else if(rating==="facil")S.run.lv=Math.min(RUN.length,S.run.lv+.5);
  else if(rating==="bien")S.run.lv=Math.min(RUN.length,S.run.lv+.34);
  const after=runLevel();
  if(after>before)wins.push({t:"Carrera: nivel "+after,s:"La próxima: "+RUN[after-1][2]+" × "+mm(RUN[after-1][0])+" corriendo"});

  const runs=ses.items.filter(i=>i.run).map(i=>({k:RUN_NAME[i.run]||"Carrera",m:Math.round(i.ph.reduce((a,x)=>a+x.s,0)/60),r:(ratings["run:"+i.run]||{}).r||null}));

con discos. Rueda hacia delante hasta donde mantengas la lumbar plana y vuelve tirando con el abdomen, no con la cadera.","De pie, barra con agarre supino a la anchura de los hombros. Sube la barra doblando los codos sin moverlos del costado ni balancear el tronco y baja en 2–3 s.","Pies bajo la barra a la anchura de la cadera. Cadera atrás, espalda recta, agarra la barra y levántala pegada a las piernas empujando el suelo; baja con el mismo camino.","Barra sobre los trapecios, pies a la anchura de los hombros. Baja todo lo que puedas con la espalda recta y las rodillas siguiendo los pies, y sube empujando el suelo.","Tumbado, barra sobre la cadera (con toalla) y rodillas dobladas. Sube la cadera apretando glúteo hasta alinear rodillas, cadera y hombros; pausa y baja.","Barra sujeta por detrás de las piernas con los talones elevados sobre un disco. Baja en sentadilla con el tronco recto y sube empujando, notando el cuádriceps.","Espalda alta apoyada en el borde del banco o un sofá estable, barra en la cadera. Sube la cadera hasta quedar plano, aprieta 1 s el glúteo y baja.","Barra en la espalda. Da un paso largo adelante y baja hasta que la rodilla de atrás casi toque el suelo; empuja con el pie delantero para volver.","Tronco inclinado casi paralelo al suelo y agarre ancho. Tira de la barra hacia el pecho alto abriendo los codos, para trabajar la parte trasera del hombro.","De pie, barra delante de las clavículas. Aprieta glúteo y abdomen y empuja la barra por encima de la cabeza, metiendo la cabeza al final; baja controlado.","De pie, barra colgando delante. Sube los hombros hacia las orejas sin doblar los codos, pausa 1 s y baja despacio.","De pie con la barra en la espalda. Inclina el tronco de lado sin girar ni echarte adelante y vuelve a subir con los oblicuos del otro lado.","Barra en la espalda y pies muy abiertos. Lleva la cadera hacia un lado doblando esa rodilla y con la otra pierna estirada; vuelve al centro y cambia de lado.","Barra apoyada en los trapecios, pies a la anchura de los hombros. Baja hasta los muslos paralelos o más con el pecho alto y sube empujando el suelo.","Barra en la espalda, da zancadas avanzando. Baja la rodilla de atrás casi al suelo y lleva el peso al pie delantero para el siguiente paso.","Tumbado en el suelo, barra sobre el pecho con los brazos casi rectos. Llévala por encima de la cabeza hasta casi tocar el suelo y vuelve tirando con los dorsales.","Tumbado, una mancuerna sujeta con las dos manos sobre el pecho y los codos algo doblados. Llévala detrás de la cabeza notando el estiramiento y vuelve.","Tumbado, rodillas dobladas en el aire. Despega la pelvis del suelo llevando las rodillas al pecho con el abdomen y baja sin arquear la lumbar.","Tronco inclinado a 45° con la espalda recta, barra colgando. Tira hacia el ombligo juntando escápulas y baja estirando los brazos.","Barra con un extremo en una esquina y peso en el otro. Inclinado, tira con una mano del extremo cargado hacia la cadera; cambia de lado.","Barra en una esquina, cargada en el otro extremo. A horcajadas sobre ella e inclinado, tira con las dos manos hacia el pecho juntando escápulas.","Tronco inclinado con la espalda recta y una mancuerna en cada mano. Tira de los codos hacia la cadera juntando escápulas y baja controlado.","Igual que el remo inclinado, pero con las palmas mirándose. Codos pegados al cuerpo, tira hacia la cadera y baja estirando del todo.","Manos sobre un apoyo bajo (mesa o banco) como en una plancha. Dobla solo los codos llevando la frente hacia las manos y estira empujando con el tríceps.","De pie, pies a la anchura de los hombros y brazos al frente. Baja como si te sentaras atrás con el pecho alto y sube empujando el suelo.","Da pasos largos avanzando. Baja la rodilla de atrás casi al suelo con el tronco recto y empuja con el pie delantero para el siguiente paso.","Tumbado, rodillas dobladas y pies apoyados. Empuja con los talones y sube la cadera apretando glúteo hasta alinear rodilla y hombro; baja despacio.","Puntera del pie sobre una mancuerna o disco, talón en el aire, apoyado en la pared. Sube de puntillas lo más alto posible y baja el talón hasta estirar.","Sentado con las piernas estiradas y la banda en la planta del pie. Empuja la punta como si pisaras un acelerador y vuelve despacio.","Cuelga de la barra con las palmas hacia ti. Tira hasta pasar la barbilla por encima de la barra con el pecho alto y baja hasta estirar los brazos.","Barra en el suelo. Súbela de un tirón hasta los hombros con piernas y cadera, y desde ahí empújala por encima de la cabeza. Técnica antes que peso.","En posición de flexión, haz una flexión y desplaza las manos un paso a un lado; repite girando como las agujas de un reloj alrededor de los pies.","Tumbado en el suelo, mancuernas juntas sobre el pecho con las palmas mirándose. Baja hasta que los codos toquen el suelo y empuja con el tríceps.","Manos juntas sobre una mancuerna tumbada, en posición de flexión. Baja el pecho a la mancuerna con los codos pegados y sube.","Barra con agarre supino estrecho. Codos pegados al cuerpo, sube la barra hasta el pecho y baja en 2–3 s sin balanceo.","Sentado, codo apoyado en la cara interna del muslo. Sube la mancuerna hacia el hombro, aprieta el bíceps arriba y baja del todo.","Tumbado, manos detrás de la cabeza. Lleva un codo hacia la rodilla contraria mientras estiras la otra pierna, y alterna.","De pie, mancuerna con la palma mirando al cuerpo. Sube la mancuerna cruzando por delante del cuerpo hacia el hombro contrario y baja.","Banda anclada detrás a la altura del pecho. Con los codos un poco doblados, junta las manos al frente como un abrazo y vuelve despacio.","Tumbado, brazos estirados por encima de la cabeza. Sube el tronco con los brazos junto a las orejas sin dar tirones y baja controlado.","Tumbado, rodillas dobladas y manos en el pecho. Despega los hombros del suelo acercando las costillas a la pelvis y baja despacio.","Brazos a 90° en cruz con los codos doblados (posición de espantapájaros). Gira los antebrazos hacia arriba y empuja las mancuernas por encima de la cabeza.","Tumbado, brazos al techo y rodillas a 90°. Baja un brazo y la pierna contraria hacia el suelo sin arquear la lumbar y vuelve; alterna.","De pie sobre un disco para tener más recorrido. Peso muerto con la espalda recta empezando más abajo: cadera atrás, agarra la barra y sube pegándola a las piernas.","Manos en el borde de un banco o silla detrás de ti, piernas estiradas. Baja doblando los codos hacia atrás hasta 90° y sube empujando con el tríceps.","Barra con agarre supino. Súbela arrastrándola pegada al cuerpo mientras los codos van hacia atrás; baja por el mismo camino.","De pie, mancuernas a los lados con las palmas al frente. Sube una doblando el codo sin moverlo, baja despacio y alterna.","De pie, mancuernas a los lados con las palmas al frente. Sube las dos a la vez sin mover los codos y baja en 2–3 s.","Mancuernas a los lados de las rodillas. Con un tirón de cadera y piernas, súbelas hasta los hombros recibiéndolas con las rodillas un poco dobladas.","Tumbado en el suelo, mancuernas sobre el pecho. Baja hasta que los codos toquen el suelo a 45° del cuerpo y empuja hasta estirar.","Tumbado en el suelo, brazos abiertos con los codos un poco doblados. Junta las mancuernas encima del pecho y baja hasta que los brazos toquen el suelo.","Una mancuerna en cada mano. Da un paso largo adelante, baja la rodilla de atrás casi al suelo y vuelve empujando con el pie delantero.","De pie, una mancuerna en el hombro. Aprieta el abdomen y empújala por encima de la cabeza sin inclinarte hacia el otro lado.","De pie o sentado, mancuerna sobre la cabeza con una mano. Baja la mancuerna detrás de la cabeza doblando el codo y estira de nuevo.","Mancuerna colgando delante con una mano. Tira hacia la barbilla con el codo por encima de la mano y baja despacio.","De pie, mancuerna sujeta con las dos manos delante de los muslos. Súbela con los brazos estirados hasta la altura de los ojos y baja controlado.","Mancuernas en las manos. Da un paso atrás y baja la rodilla de atrás casi al suelo; vuelve empujando con el pie delantero.","Inclinado o de pie, brazos estirados en diagonal formando una Y con los pulgares arriba. Sube hasta la altura de los hombros y baja despacio.","Sentado, mancuerna sobre la rodilla y puntera sobre un disco. Sube el talón todo lo posible y bájalo hasta estirar el gemelo.","De pie o sentado, mancuernas a la altura de los hombros. Empuja hacia arriba hasta estirar los brazos y baja hasta las orejas.","De pie, mancuernas a los lados. Sube los hombros hacia las orejas, pausa 1 s y baja despacio.","De pie con una mancuerna en una mano. Inclínate hacia ese lado y vuelve tirando con los oblicuos contrarios; luego cambia de mano.","Mancuernas a la altura de los hombros o colgando. Baja en sentadilla con el pecho alto y sube empujando el suelo.","Una mancuerna en cada mano frente a un escalón o silla estable. Sube apoyando todo el pie y empujando con esa pierna; baja despacio.","Tumbado en el suelo, mancuernas sobre el pecho con las palmas hacia los pies. Dobla los codos llevando las mancuernas junto a las orejas y estira.","Tumbado, manos en la nuca. Lleva el codo hacia la rodilla contraria girando el tronco y vuelve; alterna los lados.","Pie delantero sobre un disco. Da un paso atrás y baja más de lo normal; vuelve empujando con el pie de delante.","Tumbado de lado, codo pegado a las costillas a 90°. Gira el antebrazo hacia arriba sin despegar el codo y baja despacio.","Banda a la altura del codo, codo pegado al costado a 90°. Gira el antebrazo hacia fuera sin despegar el codo y vuelve despacio.","Corre en el sitio subiendo las rodillas a la altura de la cadera, rápido, apoyando la punta del pie y moviendo los brazos.","De rodillas con los talones sujetos bajo un mueble firme. Déjate caer adelante muy despacio con el cuerpo recto y frénate con las manos; vuelve empujando.","Tumbado en el suelo, barra sobre el pecho con agarre a la anchura de los hombros. Baja hasta que los codos toquen el suelo y empuja.","Tumbado boca arriba, piernas estiradas y algo elevadas. Cruza las piernas arriba y abajo como unas tijeras sin que la lumbar se despegue del suelo.","Baja a media sentadilla y salta lo más alto posible estirando todo el cuerpo. Aterriza suave doblando las rodillas y repite.","Barra delante en los hombros, codos altos. Baja en sentadilla con el tronco muy vertical y sube empujando el suelo sin dejar caer los codos.","De pie, mancuerna delante del muslo. Súbela con el brazo estirado hasta la altura del hombro y baja despacio.","Tumbado, mancuerna sobre el pecho. Llévala por encima de la cabeza con los brazos casi estirados y vuelve al frente.","Barra en los hombros con la palma hacia arriba y los dedos bajo la barra, codos altos. Baja en sentadilla con el tronco recto y sube.","De pie, dos mancuernas delante de los muslos. Súbelas con los brazos estirados hasta la altura del hombro y baja controlado.","A cuatro patas. Lleva una pierna hacia atrás y arriba apretando el glúteo sin arquear la lumbar y vuelve despacio.","Barra en la espalda, rodillas un poco dobladas. Lleva la cadera atrás con la espalda recta hasta notar los isquios y vuelve apretando glúteo.","De pie, mancuernas con las palmas mirándose. Sube doblando los codos sin girar la muñeca y baja despacio.","Manos en el suelo y pies apoyados en la pared, cuerpo en V invertida o casi vertical. Baja la cabeza al suelo doblando los codos y empuja.","Colgado de la barra. Sube las piernas estiradas o las rodillas hacia el pecho enrollando la pelvis, sin balancearte, y baja despacio.","Colgado de la barra. Sube las piernas estiradas hasta formar una V con el cuerpo y baja controlado.","De pie, banda en el tobillo anclada delante. Lleva la pierna estirada hacia atrás apretando el glúteo y vuelve despacio.","De pie, banda en el tobillo anclada detrás. Sube la rodilla hacia el pecho contra la banda y baja controlado.","Tumbado con la banda sobre la cadera sujeta con las manos. Sube la cadera apretando glúteo y baja despacio.","Banda a la altura del codo, codo pegado al costado a 90°. Gira el antebrazo hacia el abdomen sin despegar el codo y vuelve.","Tumbado debajo de una barra o mesa firme. Agarra y tira del pecho hacia ella con el cuerpo recto; baja estirando los brazos.","Colgado o tumbado con las piernas arriba. Mantén las piernas a un lado sin tocar el suelo con la lumbar apoyada; aguanta y cambia de lado.","Tumbado en el suelo, barra con agarre estrecho. Baja la barra hacia el cuello doblando los codos hacia delante y empuja con el tríceps.","Tumbado, brazos y piernas estirados. Sube a la vez tronco y piernas para tocar los pies y baja despacio.","Salta desde parado llevando las rodillas al pecho y aterriza suave con las rodillas dobladas.","De rodillas con la barra en la espalda. Siéntate en los talones y sube la cadera apretando el glúteo.","Salta de lado de un pie a otro o con los dos pies sobre una línea, aterrizando suave.","Banda en los pies o en las manos. Levanta el brazo de lado hasta la altura del hombro y baja despacio.","Tumbado boca arriba. Sube las piernas estiradas hasta la vertical y baja sin que la lumbar se despegue del suelo.","Sentado con las manos atrás y las piernas estiradas. Recoge las rodillas hacia el pecho y estira de nuevo sin tocar el suelo.","Tumbado en el suelo, barra con agarre estrecho y brazos al techo. Dobla los codos bajando la barra a la frente y estira.","Tumbado en el suelo, mancuernas sobre el pecho. Dobla solo los codos bajando las mancuernas junto a las orejas y estira.","Tumbado de lado, mancuerna en la mano de arriba. Sube el brazo estirado hasta la vertical y baja despacio.","Tumbado boca abajo, mancuernas colgando o sobre el suelo. Abre los brazos hacia los lados juntando escápulas y baja.","Tumbado boca abajo en un apoyo inclinado, barra o mancuernas colgando. Junta y sube las escápulas sin doblar los codos y baja.","Banda en los tobillos o por encima de las rodillas. Da pasos cortos en diagonal manteniendo la banda tensa y las rodillas hacia fuera.","En posición de plancha, lleva una rodilla hacia el pecho y luego la otra, rápido, sin subir la cadera.","De pie con los pies juntos. Baja en sentadilla con el pecho alto y sube empujando el suelo.","Tumbado de lado o boca arriba con las rodillas giradas. Sube el tronco hacia un lado acercando costilla y cadera.","Tumbado, rodillas dobladas y caídas a un lado. Sube los hombros hacia el techo con los oblicuos y baja despacio.","Mano y rodilla apoyadas en un banco o silla, espalda recta. Tira de la mancuerna hacia la cadera y baja estirando.","Barra en una esquina con peso. De lado a ella, agarra el extremo con una mano y tira hacia la cadera con el codo abierto.","Mancuerna en una mano a un lado. Baja con la espalda recta llevando la cadera atrás y sube sin inclinarte; cambia de lado.","De pie, mancuerna en una mano. Sube el brazo de lado hasta la altura del hombro y baja despacio.","Tumbado en el suelo, una mancuerna sobre el pecho. Baja hasta que el codo toque el suelo y empuja sin girar el tronco.","Tumbado, una mancuerna sobre el pecho con la palma hacia los pies. Dobla el codo hacia el hombro contrario y estira.","Tumbado, mancuerna con la palma hacia la cara. Dobla el codo bajando la mancuerna junto al hombro y estira.","Barra en la espalda, un pie apoyado detrás en un banco o sofá. Baja con la pierna delantera y sube empujando.","Apoyado en antebrazos y puntas de los pies, cuerpo recto. Aprieta glúteo y abdomen y aguanta sin hundir ni subir la cadera.","Pies muy abiertos con las puntas hacia fuera, mancuerna colgando con las dos manos. Baja en sentadilla y sube empujando.","Desde flexión, baja y empuja tan fuerte que las manos se despeguen del suelo; aterriza suave.","Barra en el suelo. Súbela de un tirón a los hombros extendiendo cadera y rodillas y recíbela con media sentadilla.","Barra delante en los hombros. Empuja por encima de la cabeza solo en la parte alta del recorrido, sin bajar del todo.","Cuelga de la barra con las palmas al frente. Tira hasta pasar la barbilla por encima con el pecho alto y baja hasta estirar.","Manos más abiertas que los hombros en posición de flexión. Baja el pecho al suelo con el cuerpo recto y sube.","Manos juntas bajo el pecho en posición de flexión. Baja con los codos pegados al cuerpo y sube empujando con el tríceps.","Pies sobre una silla o sofá y manos en el suelo. Baja el pecho con el cuerpo recto y sube.","Haz una flexión y, al subir, gira a plancha lateral levantando un brazo al techo; vuelve y cambia de lado.","Manos bajo los hombros, cuerpo recto de cabeza a talones. Baja hasta casi tocar el suelo con el pecho y sube.","Alterna una flexión con las manos abiertas y otra con las manos juntas, sin perder la línea del cuerpo.","Barra con agarre prono (palmas hacia abajo). Sube doblando los codos sin moverlos y baja despacio.","Tumbado, rodillas a 90°. Despega la pelvis del suelo llevando las rodillas al pecho y baja en 3 s.","Tronco inclinado con la espalda recta. Abre los brazos hacia los lados con los codos un poco doblados y baja despacio.","Inclinado, abre los brazos hacia los lados y al final gira los pulgares hacia atrás; vuelve despacio.","Tronco inclinado a 45°, barra con agarre supino. Tira hacia el ombligo con los codos pegados y baja.","Baja a media sentadilla y salta como un cohete estirando los brazos por encima de la cabeza; aterriza suave.","De pie sobre un escalón, talones fuera. Sube de puntillas y baja el talón con un pequeño balanceo controlado.","Rodillas un poco dobladas, barra o mancuernas delante. Lleva la cadera atrás con la espalda recta hasta media pierna y vuelve apretando glúteo.","Sentado con los pies en el aire y la espalda inclinada. Gira el tronco de un lado a otro llevando las manos al suelo.","Colgado de la barra con los brazos estirados. Baja y sube los hombros juntando las escápulas sin doblar los codos.","Salta abriendo piernas y brazos y vuelve a cerrar; ritmo constante.","Sentado e inclinado, mancuerna en una mano con el brazo pegado al cuerpo. Estira el codo hacia atrás y vuelve.","Sentado en el borde de una silla e inclinado sobre las piernas. Abre los brazos hacia los lados con los codos un poco doblados.","Sentado, mancuernas a los lados. Sube doblando los codos sin mover el tronco y baja despacio.","Sentado, antebrazos sobre los muslos con las palmas hacia abajo. Sube solo las muñecas y baja.","Sentado, antebrazos sobre los muslos con las palmas hacia arriba. Sube solo las muñecas y baja.","Sentado, mancuernas a la altura de los hombros. Empuja hacia arriba hasta estirar y baja despacio.","Sentado en el suelo inclinado atrás. Recoge las rodillas al pecho y estira las piernas sin tocar el suelo.","Sentado, mancuernas a los lados. Sube los brazos de lado hasta la altura del hombro y baja despacio.","Sentado, una mancuerna sujeta con las dos manos por encima de la cabeza. Bájala detrás de la nuca y estira.","De pie o sentado, empuja una mancuerna arriba mientras bajas la otra, alternando en balancín.","De pie sobre la banda, manos a la altura de los hombros. Empuja hacia arriba hasta estirar y baja despacio.","Apoyado en un antebrazo y en el borde del pie, cuerpo recto de cabeza a pies. Aguanta sin dejar caer la cadera.","Tumbado de lado. Sube a la vez el tronco y la pierna de arriba hacia el centro y baja despacio.","De pie, mancuernas a los lados. Sube los brazos de lado hasta la altura del hombro con los codos un poco doblados y baja en 2 s.","De pie, sube los brazos de lado hasta la altura del hombro, llévalos al frente y vuelve haciendo el recorrido contrario.","Salta de lado lo más lejos posible desde una pierna y aterriza en la otra, estable.","Pies muy abiertos y un brazo a la espalda. Baja el pecho al suelo con el cuerpo recto y sube. Muy avanzado.","Tumbado, un pie apoyado y la otra pierna estirada. Sube la cadera empujando con el talón y baja.","Tumbado, rodillas dobladas. Sube el tronco hasta sentarte con el abdomen y baja despacio.","Barra en el suelo con agarre muy ancho. Súbela de un tirón extendiendo cadera y rodillas sin doblar los brazos al principio.","De pie, banda anclada abajo detrás. Codos al techo, estira los brazos por encima de la cabeza y vuelve.","En posición de plancha. Lleva una rodilla hacia el codo del mismo lado por fuera del cuerpo y alterna.","Desde zancada, salta y cambia de pierna en el aire, aterrizando suave en zancada.","Mancuernas en las manos, un pie delante y otro detrás. Baja la rodilla de atrás casi al suelo y sube sin mover los pies.","De pie sobre la banda, manos a la altura de los hombros. Baja en sentadilla y sube contra la banda.","De pie, mancuernas en los hombros. Empuja una por encima de la cabeza, bájala y empuja la otra.","De pie, barra en la espalda. Sube de puntillas lo más alto posible y baja despacio.","De pie e inclinado, mancuerna en una mano con el codo pegado. Estira el codo hacia atrás y vuelve.","De pie e inclinado, una mancuerna en cada mano. Estira los codos hacia atrás a la vez y vuelve.","De pie e inclinado, codo junto a la rodilla. Sube la mancuerna hacia el hombro y baja del todo.","De pie, mancuernas a los lados. Sube de puntillas lo más alto posible y baja despacio.","De pie, mancuernas a la altura de los hombros. Empuja hacia arriba hasta estirar y baja despacio.","De pie, mancuernas con las palmas hacia abajo. Sube doblando los codos sin girar las muñecas y baja.","De pie, mancuerna sujeta con las dos manos sobre la cabeza. Bájala detrás de la nuca doblando los codos y estira.","De pie, mancuernas delante de los muslos. Tira hacia la barbilla con los codos altos y baja despacio.","Salta hacia delante lo más lejos posible con impulso de brazos y aterriza suave con las rodillas dobladas.","De pie, barra delante de las clavículas. Aprieta glúteo y abdomen y empuja por encima de la cabeza; baja controlado.","De pie, mancuerna sobre la cabeza con una mano. Bájala detrás de la cabeza doblando el codo y estira.","De pie, barra sobre la cabeza con agarre estrecho. Bájala detrás de la nuca doblando los codos y estira.","Tumbado, una mancuerna sobre el pecho con la palma hacia dentro. Baja con el codo pegado y empuja.","Tumbado, mancuernas sobre el pecho con las palmas mirándose. Baja con los codos pegados y empuja.","Salta abriendo brazos y piernas en forma de estrella en el aire y aterriza suave.","Sube a un escalón o silla estable y lleva la rodilla contraria arriba; baja despacio.","Piernas casi estiradas y barra delante. Lleva la cadera atrás con la espalda recta hasta notar los isquios y sube.","Piernas casi estiradas y mancuernas delante. Lleva la cadera atrás con la espalda recta y sube apretando glúteo.","Tumbado en el suelo, brazos estirados al techo con una mancuerna. Llévala por encima de la cabeza sin doblar los codos y vuelve.","Pies muy abiertos con las puntas hacia fuera, barra delante. Agarra entre las piernas y sube con la espalda recta empujando el suelo.","Tumbado, mancuernas sobre el pecho con las palmas hacia los pies. Dobla los codos hacia fuera hasta tocar el pecho y estira.","De pie e inclinado, mancuerna en la mano con el codo pegado. Estira el codo hacia atrás y vuelve.","Tumbado, sube a la vez el tronco y las rodillas hacia el centro y vuelve a estirar.","De pie, barra delante de los muslos con agarre estrecho. Tira hacia la barbilla con los codos altos y baja.","De pie sobre la banda. Tira hacia la barbilla con los codos altos y baja despacio.","Pies anchos, mancuerna entre las piernas. Lleva la cadera atrás y lánzala arriba con un golpe de cadera hasta la cabeza; baja controlado.","Cuelga de la barra con agarre muy ancho. Tira del pecho hacia la barra y baja hasta estirar.","Barra con agarre supino más ancho que los hombros. Sube doblando los codos sin moverlos y baja.","Barra en la espalda, pies muy abiertos. Baja en sentadilla con las rodillas hacia fuera y sube.","De pie, mancuernas con las palmas al frente. Sube en curl, gira las palmas hacia abajo arriba y baja así; gira al final."];
